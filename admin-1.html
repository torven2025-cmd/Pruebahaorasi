function drawB(){$('bl2').innerHTML=B.map(b=>`<div class="card${sel==b.id?' sel':''}" data-id="${esc(b.id)}">${badgeHTML(b,52)}<div><b>${esc(b.name)}</b><small>${RN[b.rarity]||b.rarity} · ${b.owners} jugador(es)</small></div></div>`).join('')||'<small>No hay insignias.</small>'}
function getStyle(){const s={};if($('esh').value!='circle')s.shape=$('esh').value;if($('ept').value!='none')s.pat=$('ept').value;if($('erg').value)s.ring=$('erg').value;if($('eff').value)s.font=$('eff').value;
 if($('ec3o').checked)s.c3=$('ec3').value;if($('etco').checked)s.tc=$('etc').value;if(+$('efs').value!=100)s.fs=+$('efs').value/100;
 if($('eor').value.trim())s.orn=$('eor').value.trim();if($('eri').value.trim()){s.rib=$('eri').value.trim();s.rc=$('erc').value}
 if($('eim').value.trim())s.img=$('eim').value.trim();const fx=[...document.querySelectorAll('[data-fx]:checked')].map(x=>x.dataset.fx);if(fx.length)s.fx=fx;return s}
function setStyle(s){s=s||{};$('esh').value=s.shape||'circle';$('ept').value=s.pat||'none';$('erg').value=s.ring||'';$('eff').value=s.font||'';$('ec3o').checked=!!s.c3;$('ec3').value=s.c3||'#ffffff';$('etco').checked=!!s.tc;$('etc').value=s.tc||'#ffffff';
 $('efs').value=Math.round((s.fs||1)*100);$('efsv').textContent=$('efs').value;$('eor').value=s.orn||'';$('eri').value=s.rib||'';$('erc').value=s.rc||'#c0392b';$('eim').value=s.img||'';
 document.querySelectorAll('[data-fx]').forEach(x=>x.checked=(s.fx||[]).includes(x.dataset.fx))}
function curB(){return{rarity:$('era').value,icon:$('eic').value,c1:$('ec1').value,c2:$('ec2').value,style:getStyle()}}
function prev(){$('efsv').textContent=$('efs').value;const b=curB();$('pv').innerHTML=badgeHTML(b,120)+badgeHTML(b,64)+badgeHTML(b,36)}
function fill(b){sel=b?b.id:null;$('et').textContent=b?'Editar insignia':'Nueva insignia';$('eid').value=b?b.id:'';$('eid').disabled=!!b;$('enm').value=b?b.name:'';$('era').value=b?b.rarity:'common';$('eic').value=b?b.icon:'⭐';$('ec1').value=b?b.c1:'#6aa8ff';$('ec2').value=b?b.c2:'#2b57c4';$('eds').value=b?b.descr||'':'';setStyle(b&&b.style);$('bd').classList.toggle('hide',!b);msg('em');drawB();prev()}
async function bsave(){const id=$('eid').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(!id)return msg('em','Escribe un ID (letras, números o _)','e');const n=$('enm').value.trim();if(!n)return msg('em','Escribe un nombre','e');
 const st=getStyle();if(st.img&&!/^https:\/\/[^\s"'<>]+$/.test(st.img))return msg('em','La imagen debe ser una URL https válida','e');
 try{await rpc('admin_badge_save',{p_id:id,p_name:n,p_rarity:$('era').value,p_icon:$('eic').value||'⭐',p_c1:$('ec1').value,p_c2:$('ec2').value,p_descr:$('eds').value,p_style:st})}catch(e){return msg('em',errT(e),'e')}
 B=await rpc('admin_badges');fill(B.find(b=>b.id==id));msg('em','Guardada ✔','o')}
async function bdel(){const b=B.find(x=>x.id==sel);if(!b||!confirm(`¿Eliminar "${b.name}"? Se quitará a sus ${b.owners} dueño(s).`))return;
 try{await rpc('admin_badge_delete',{p_id:b.id})}catch(e){return msg('em',errT(e),'e')}B=await rpc('admin_badges');fill(null);msg('em','Eliminada','o')}
/* ===== Anti-trampas ===== */
async function vAc(){const [ch,rd,st]=await Promise.all([rpc('admin_cheats',{p_limit:100}),rpc('admin_raids',{p_limit:60}),rpc('admin_stats')]);CFG=st.cfg||{};const en=CFG.enforce=='true';
 $('view').innerHTML=`<div class=pn><h2>Anti-trampas</h2><p class=muted>Modo actual: <b>${en?'BLOQUEA (el servidor revierte partidas imposibles)':'solo REGISTRA (no bloquea)'}</b>. Recomendado: déjalo en "registra" 30 min con 2-3 testers; si no hay falsos positivos en la lista de abajo, actívalo.</p>
 <div class=row><button class="${en?'g':'o'}" data-a=enf>${en?'Pasar a solo registrar':'Activar bloqueo'}</button><button class=d data-a=clrCh>Vaciar registro</button></div></div>
 <div class=pn><h2>Violaciones (${ch.length})</h2>${ch.map(c=>`<div class=it><div class=top><span class="tag y">${esc(c.kind)}</span><b data-pl="${c.uid}">${esc(c.name||'?')}</b><span class=muted>${fT(c.at)}</span></div><div class=muted>${esc(JSON.stringify(c.detail)).slice(0,260)}</div></div>`).join('')||'<span class=muted>Sin violaciones 🎉</span>'}</div>
 <div class=pn><h2>Ataques recientes</h2><table><tr><th>Cuándo</th><th>Atacante</th><th>Defensor</th><th>★ %</th><th>Botín</th></tr>${rd.map(r=>`<tr><td>${fT(r.created_at)}</td><td data-pl="${r.attacker}" style="cursor:pointer">${esc(r.an||'?')}</td><td data-pl="${r.defender}" style="cursor:pointer">${esc(r.dn||'?')}</td><td>${'★'.repeat(r.stars)||'—'} ${r.pct}%</td><td>🪙${r.gold} 💧${r.elixir}</td></tr>`).join('')}</table></div>`}
/* ===== Errores ===== */
async function vEr(){const l=await rpc('admin_errors',{p_limit:100});$('view').innerHTML=`<div class=pn><div class=row><h2 class=grow>Errores del cliente (${l.length})</h2><button class=d data-a=clrEr>Vaciar</button></div>${l.map(e=>`<div class=it><div class=top><span class="tag ${e.n>5?'r':'y'}">×${e.n}</span><b>${esc(e.name||'?')}</b><span class=muted>${esc(e.build||'')} · ${fT(e.last_at)}</span></div><div style="word-break:break-word">${esc(e.msg)}</div>${e.stack?`<details><summary class=muted>detalle</summary><pre>${esc(e.stack)}\n${esc(JSON.stringify(e.info||{}))}</pre></details>`:''}</div>`).join('')||'<span class=muted>Sin errores 🎉</span>'}</div>`}
/* ===== Códigos ===== */
async function vCo(){const l=await rpc('admin_codes');$('view').innerHTML=`<div class=pn><div class=row><h2 class=grow>Códigos de invitación (${l.filter(x=>x.used_by).length}/${l.length} usados)</h2><button class=g data-a=csv>⬇ CSV</button></div>
 <div class=row style="margin:8px 0"><input id=ncl placeholder="Etiqueta (ej. tester31)" class=grow><button class=o data-a=newcode>+ Crear código</button></div>
 ${l.map(c=>`<div class=it><div class=top><b>${esc(c.label||'')}</b><code style="font-size:16px;letter-spacing:1px">${fmtCode(c.code)}</code>${c.disabled?'<span class="tag r">desactivado</span>':''}${c.used_by?`<span class="tag g">usado por ${esc(c.player||'?')}</span><span class=muted>${fT(c.used_at)}</span>`:'<span class=tag>libre</span>'}</div>
 <div class=row style="margin-top:6px"><button class="g s" data-cp="${c.code}">Copiar</button><button class="g s" data-cd="${c.code}" data-v=${c.disabled?0:1}>${c.disabled?'Activar':'Desactivar'}</button>${c.used_by?`<button class="w s" data-cr="${c.code}">Liberar código</button>`:''}</div></div>`).join('')}</div>`;window.__codes=l}
/* ===== Configuración ===== */
async function vCf(){const st=await rpc('admin_stats');CFG=st.cfg||{};const be=CFG.beta_end?new Date(CFG.beta_end):null,loc=be?new Date(be.getTime()-be.getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 $('view').innerHTML=`<div class=pn><h2>Estado del juego</h2>
 <label><input type=checkbox id=cmt ${CFG.maintenance=='true'?'checked':''}> Modo mantenimiento (solo los administradores pueden jugar)</label>
 <label>Mensaje de mantenimiento</label><textarea id=cmm>${esc(CFG.maint_msg||'')}</textarea><button data-a=savemt>Guardar mantenimiento</button></div>
 <div class=pn><h2>Fin de la beta</h2><div class=row><input type=datetime-local id=cbe value="${loc}"><button data-a=savebe>Guardar</button><button class=g data-a=be7>Ahora + 7 días</button><button class=g data-a=benone>Sin fecha</button></div><p class=muted>Al llegar la fecha, el servidor bloquea la partida a los jugadores (tú sigues pudiendo entrar).</p></div>
 <div class=pn><h2>Anuncio para los jugadores</h2><textarea id=cmo placeholder="Mensaje (aparece una vez en la pantalla de cada jugador)">${esc(CFG.motd||'')}</textarea><div class=row><button data-a=savemo>Publicar anuncio</button><button class=g data-a=clrmo>Quitar</button></div></div>
 <div class=pn><h2>Límites y matchmaking</h2><div class=row><div><label>Búsquedas/hora por jugador</label><input type=number id=cl1 value="${esc(CFG.mm_search_h||240)}"></div><div><label>Ataques/hora por jugador</label><input type=number id=cl2 value="${esc(CFG.raid_h||12)}"></div><div><label>Botín máx./hora (oro+elixir)</label><input type=number id=cl3 value="${esc(CFG.loot_h||250000)}"></div><div><label>Duración mínima de un ataque (s)</label><input type=number id=cl4 value="${esc(CFG.raid_min_s||8)}"></div></div><button style="margin-top:10px" data-a=savelim>Guardar límites</button></div>
 <div class=pn><h2>Peligro</h2><p class=muted>Reinicia TODAS las aldeas (usa la función admin_reset_all existente). Úsalo solo antes de abrir la beta.</p><button class=d data-a=resetall>♻ Reiniciar todos los jugadores</button></div>`}
async function setCfg(k,v){await rpc('admin_cfg_set',{p_k:k,p_v:String(v)});CFG[k]=String(v)}
/* ===== Acciones globales ===== */
document.addEventListener('click',async e=>{const t=e.target;
 const pl=t.closest('[data-pl]');if(pl&&!t.closest('.sheet button')){openPl(pl.dataset.pl);return}
 const a=t.closest('[data-a]');
 if(t.closest('[data-rv]')&&DET){const b=t.closest('[data-rv]');try{await rpc('admin_badge_revoke',{p_player:DET.id,p_badge:b.dataset.rv});const x=PLs.find(p=>p.id==DET.id);if(x)x.badges=x.badges.filter(i=>i!=b.dataset.rv);DET=await rpc('admin_player',{p_id:DET.id});drawDet();toast('Quitada','o')}catch(er){}return}
 const fs=t.closest('[data-fs]');if(fs){FBS=fs.dataset.fs;vFb();return}
 const fa=t.closest('[data-fa]');if(fa){const id=+fa.dataset.id,r=$('r'+id).value.trim();try{await rpc('admin_feedback_set',{p_id:id,p_status:fa.dataset.fa,p_reply:r});toast('Guardado','o');ST=await rpc('admin_stats');go('fb')}catch(er){}return}
 const cp=t.closest('[data-cp]');if(cp){try{await navigator.clipboard.writeText(fmtCode(cp.dataset.cp));toast('Copiado','o')}catch(er){toast(fmtCode(cp.dataset.cp))}return}
 const cd=t.closest('[data-cd]');if(cd){await rpc('admin_code_set',{p_code:cd.dataset.cd,p_disabled:cd.dataset.v=='1',p_release:false});vCo();return}
 const cr=t.closest('[data-cr]');if(cr){if(!confirm('¿Liberar el código? El jugador que lo usó conserva su cuenta, pero el código podrá usarse de nuevo.'))return;await rpc('admin_code_set',{p_code:cr.dataset.cr,p_disabled:false,p_release:true});vCo();return}
 if(!a)return;const x=a.dataset.a;
 try{
 if(x=='closeSheet'){$('sheet').classList.add('hide');return}
 if(['gp','gm','gs','rp','rm','wp','wm','xp','tr','sh','warn','ban','unban','reset','grant','dl'].includes(x)){detAct(x);return}
 if(x=='refresh'){vRes();return}
 if(x=='maint'){await setCfg('maintenance',CFG.maintenance=='true'?'false':'true');toast('Hecho','o');vRes()}
 else if(x=='enf'){await setCfg('enforce',CFG.enforce=='true'?'false':'true');toast('Hecho','o');TAB=='ac'?vAc():vRes()}
 else if(x=='clrCh'){if(confirm('¿Vaciar el registro de violaciones?')){await rpc('admin_cheats_clear');vAc()}}
 else if(x=='clrEr'){if(confirm('¿Vaciar errores?')){await rpc('admin_errors_clear');vEr()}}
 else if(x=='newcode'){const c=await rpc('admin_code_create',{p_label:$('ncl').value.trim()});toast('Código: '+fmtCode(c),'o');vCo()}
 else if(x=='csv'){const rows=['tester,codigo,estado,jugador'].concat((window.__codes||[]).map(c=>[c.label,fmtCode(c.code),c.disabled?'desactivado':c.used_by?'usado':'libre',c.player||''].join(',')));const bl=new Blob([rows.join('\n')],{type:'text/csv'}),u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='codigos_beta.csv';l.click()}
 else if(x=='savemt'){await setCfg('maint_msg',$('cmm').value);await setCfg('maintenance',$('cmt').checked);toast('Guardado','o')}
 else if(x=='savebe'){const v=$('cbe').value;await setCfg('beta_end',v?new Date(v).toISOString():'');toast('Guardado','o')}
 else if(x=='be7'){const d=new Date(Date.now()+7*864e5);await setCfg('beta_end',d.toISOString());toast('Fin: '+d.toLocaleString('es'),'o');vCf()}
 else if(x=='benone'){await setCfg('beta_end','');toast('Sin fecha','o');vCf()}
 else if(x=='savemo'){await setCfg('motd',$('cmo').value.trim());toast('Anuncio publicado','o')}
 else if(x=='clrmo'){await setCfg('motd','');$('cmo').value='';toast('Anuncio quitado','o')}
 else if(x=='savelim'){await setCfg('mm_search_h',+$('cl1').value||240);await setCfg('raid_h',+$('cl2').value||12);await setCfg('loot_h',+$('cl3').value||250000);await setCfg('raid_min_s',+$('cl4').value||8);toast('Guardado','o')}
 else if(x=='resetall'){if(prompt('Escribe REINICIAR para confirmar')=='REINICIAR'){await rpc('admin_reset_all');toast('Todos reiniciados','o')}}
 }catch(er){}});
$('bl').onclick=login;$('p').onkeydown=e=>{if(e.key=='Enter')login()};$('bo').onclick=async()=>{await sb.auth.signOut();location.reload()};
(async()=>{try{const s=(await sb.auth.getSession()).data.session;if(s){ST=await rpc('admin_stats');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent='Sesión: '+(s.user.email||'').split('@')[0];CFG=ST.cfg||{};go(location.hash.slice(1)||'res')}}catch(e){}})();
</script></body></html>
