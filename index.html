<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle - HUD Clash Of Clans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            
            <!-- HUD PRINCIPAL -->
            <div id="main-hud">
                
                <!-- Controles Izquierda (Pantalla Completa) -->
                <div id="top-left-controls">
                    <button class="icon-btn" onclick="toggleFullScreen()" id="btn-fs" title="Pantalla Completa">🔲</button>
                </div>

                <!-- Recursos Estilo CoC (Superior Derecho) -->
                <div id="ui-top-right">
                    <div class="res-pill pill-wood">
                        <div class="res-value" id="res-wood">0</div>
                        <div class="res-icon">🪵</div>
                    </div>
                    <div class="res-pill pill-stone">
                        <div class="res-value" id="res-stone">0</div>
                        <div class="res-icon">🪨</div>
                    </div>
                    <div class="res-pill pill-coins">
                        <div class="res-value" id="res-coins">0/100</div>
                        <div class="res-icon">🪙</div>
                    </div>
                    <div class="res-pill pill-troops">
                        <div class="res-value" id="res-troops">0/0</div>
                        <div class="res-icon">🗡️</div>
                    </div>
                </div>

                <!-- Botones Inferiores (Atacar y Tienda) -->
                <button id="btn-attack-hud" class="corner-btn" onclick="startCombatMatch()">
                    <div class="btn-icon">🗺️</div><span>Atacar</span>
                </button>

                <button id="btn-shop-hud" class="corner-btn" onclick="openShop()">
                    <div class="btn-icon">🔨</div><span>Tienda</span>
                </button>
            </div>

            <!-- CONTROLES DE COLOCACIÓN (Aparecen al elegir algo en la tienda) -->
            <div id="placement-controls" class="hidden">
                <button id="btn-cancel" onclick="cancelPlacement()">❌ Cancelar</button>
                <button id="btn-confirm" onclick="confirmPlacement()">✅ Colocar</button>
            </div>

            <!-- CONTROLES DE EDICIÓN (Al tocar un edificio) -->
            <div id="edit-controls" class="hidden">
                <button id="btn-train-troop" onclick="trainTroop()" style="display:none;">🗡️ Entrenar Bárbaro (25🪵)</button>
                <button id="btn-repair" onclick="repairBuilding()">🔨 Reparar</button>
                <button id="btn-relocate" onclick="startRelocate()">🔄 Reubicar</button>
                <button id="btn-destroy-init" onclick="initDestroy()">💥 Destruir</button>
                <button id="btn-cancel-edit" onclick="cancelEdit()">❌ Salir</button>
            </div>

            <!-- CONTROLES DE RUINA -->
            <div id="ruin-controls" class="hidden">
                <button id="btn-rebuild" onclick="rebuildBuilding()">🏗️ Reconstruir</button>
                <button id="btn-destroy-ruin" onclick="initDestroy()">💥 Limpiar Restos</button>
                <button id="btn-cancel-ruin" onclick="cancelEdit()">❌ Salir</button>
            </div>

            <!-- CONFIRMAR DESTRUCCIÓN -->
            <div id="destroy-controls" class="hidden">
                <button id="btn-cancel-destroy" onclick="cancelEdit()">❌ Cancelar</button>
                <button id="btn-confirm-destroy" onclick="confirmDestroy()">✅ Confirmar (40%)</button>
            </div>

            <!-- UI DE COMBATE -->
            <div id="combat-ui" class="hidden">
                <div id="combat-header">
                    <h2>🔥 ASALTO EN CURSO 🔥</h2>
                    <p>Despliega tropas fuera de la zona blanca transparente.</p>
                    <button onclick="surrender()">Rendirse y Retirarse</button>
                </div>
            </div>

            <!-- MODAL DE LA TIENDA (NUEVO DISEÑO FIEL A CoC) -->
            <div id="shop-ui" class="hidden">
                <div class="shop-panel">
                    
                    <!-- Icono Superior Solitario -->
                    <div class="shop-top-icon">
                        <div class="hammer-saw-icon">🔨🪚</div>
                    </div>
                    
                    <button class="close-btn" onclick="closeShop()">X</button>
                    
                    <h2 class="shop-title">Estructuras y trampas</h2>
                    
                    <!-- Pestañas -->
                    <div class="shop-tabs">
                        <button class="tab-btn active" onclick="switchShopTab('ejercito')">Ejército</button>
                        <button class="tab-btn" onclick="switchShopTab('recursos')">Recursos</button>
                        <button class="tab-btn" onclick="switchShopTab('defensas')">Defensas</button>
                        <button class="tab-btn" onclick="switchShopTab('trampas')">Trampas</button>
                    </div>

                    <!-- Contenido de las pestañas -->
                    <div class="shop-content-area">
                        <!-- EJÉRCITO -->
                        <div id="tab-ejercito" class="shop-grid">
                            <button class="shop-card" onclick="selectBuilding('camp')">
                                <h3>Campamento</h3>
                                <p class="desc">Tus tropas se reúnen en los campamentos, así que construye más y mejóralos para levantar un poderoso ejército.</p>
                                <div class="price">200🪵 150🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('barracks')">
                                <h3>Cuartel</h3>
                                <p class="desc">El cuartel es para entrenar tropas.</p>
                                <div class="price">300🪵 200🪨</div>
                            </button>
                        </div>

                        <!-- RECURSOS -->
                        <div id="tab-recursos" class="shop-grid hidden">
                            <button class="shop-card" onclick="selectBuilding('builder_hut')">
                                <h3>Choza constructor</h3><p class="desc">Básico para aldea</p><div class="price">100🪵</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('mine')">
                                <h3>Mina de piedra</h3><p class="desc">Extrae piedra</p><div class="price">50🪵 150🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('goldmine')">
                                <h3>Mina de oro</h3><p class="desc">Extrae monedas</p><div class="price">250🪵 250🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('lumbermill')">
                                <h3>Choza de leñador</h3><p class="desc">Extrae madera</p><div class="price">150🪵 50🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('miner_hut')">
                                <h3>Choza de minero</h3><p class="desc">Acelera extracción</p><div class="price">150🪵 150🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('vault_stone')">
                                <h3>Almacén Piedra</h3><p class="desc">Guarda piedra</p><div class="price">200🪵 200🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('vault_wood')">
                                <h3>Almacén Madera</h3><p class="desc">Guarda madera</p><div class="price">200🪵 200🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('vault_coins')">
                                <h3>Almacén Monedas</h3><p class="desc">Guarda monedas</p><div class="price">400🪵 400🪨</div>
                            </button>
                        </div>

                        <!-- DEFENSAS -->
                        <div id="tab-defensas" class="shop-grid hidden">
                            <button class="shop-card" onclick="selectBuilding('cannon')">
                                <h3>Cañón</h3>
                                <p class="desc">Defensa ideal para cualquier zona terrestre.</p>
                                <div class="price">200🪵 200🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('tower')">
                                <h3>Torre arqueras</h3>
                                <p class="desc">Dispara a distancia protegiendo la base.</p>
                                <div class="price">250🪵 250🪨</div>
                            </button>
                            <button class="shop-card" onclick="selectBuilding('wall')">
                                <h3>Muro</h3>
                                <p class="desc">Protege tu aldea frenando enemigos.</p>
                                <div class="price">40🪵 20🪨</div>
                            </button>
                        </div>

                        <!-- TRAMPAS -->
                        <div id="tab-trampas" class="shop-grid hidden">
                            <p style="text-align:center; width:100%; color:#555; padding: 20px;">Próximamente...</p>
                        </div>
                    </div>

                    <!-- RECURSOS ABAJO (Madera, Piedra, Monedas) -->
                    <div class="shop-footer">
                        <div class="shop-res res-wood"><span id="shop-wood">0</span> 🪵</div>
                        <div class="shop-res res-stone"><span id="shop-stone">0</span> 🪨</div>
                        <div class="shop-res res-coins"><span id="shop-coins">0</span> 🪙</div>
                    </div>
                </div>
            </div>
            
            <div id="notification-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
