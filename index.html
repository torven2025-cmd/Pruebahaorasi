<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración clave para que se vea y juegue bien en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- El mundo 2D se dibujará aquí -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Capa de Interfaz de Usuario -->
        <div id="ui-layer">
            
            <!-- Barra superior: Recursos -->
            <div id="resource-bar">
                <div class="resource" title="Madera">🪵 <span id="res-wood">0</span></div>
                <div class="resource" title="Piedra">🪨 <span id="res-stone">0</span></div>
                <div class="resource" title="Puntos de Victoria">🏆 <span id="res-points">0</span></div>
            </div>

            <!-- Menú inferior: Construcción -->
            <div id="build-menu">
                <button class="build-btn" onclick="selectBuilding('wall')">
                    🧱 Muro<br><small>10🪵 5🪨</small>
                </button>
                <button class="build-btn" onclick="selectBuilding('tower')">
                    🗼 Torre<br><small>20🪵 15🪨</small>
                </button>
                <button class="build-btn" onclick="selectBuilding('archer')">
                    🏹 Arquero<br><small>10🪵 0🪨</small>
                </button>
            </div>

            <!-- Controles laterales: Acción y Recolección -->
            <div id="action-menu">
                <button id="btn-gather" onclick="gatherResources()">⛏️ Talar/Picar</button>
                <button id="btn-combat" onclick="openCombat()">⚔️ Buscar Combate</button>
            </div>

            <!-- Pantalla de Combate 1 vs 1 (Oculta por defecto) -->
            <div id="combat-overlay" class="hidden">
                <div class="combat-panel">
                    <h2>⚔️ Batalla de Castillos ⚔️</h2>
                    <p>Atacando y defendiendo simultáneamente...</p>
                    
                    <div class="health-bars">
                        <div class="hp-box">
                            <span>Tu Castillo</span>
                            <progress id="hp-player" value="100" max="100"></progress>
                            <span id="hp-player-text">100/100</span>
                        </div>
                        <div class="hp-box">
                            <span>Castillo Enemigo</span>
                            <progress id="hp-enemy" value="100" max="100"></progress>
                            <span id="hp-enemy-text">100/100</span>
                        </div>
                    </div>

                    <div id="combat-log">¡Prepárate para la batalla!</div>
                    
                    <div class="combat-actions">
                        <button id="btn-attack" onclick="performAttack()">🗡️ Lanzar Ataque</button>
                        <button id="btn-flee" onclick="fleeCombat()">🏃 Retirada</button>
                    </div>
                </div>
            </div>
            
            <!-- Sistema de Notificaciones flotantes -->
            <div id="notification-area"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
