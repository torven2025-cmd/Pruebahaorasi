<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle 6.0 - Economía Pasiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="resource-bar">
                <div class="resource" title="Madera">🪵 <span id="res-wood">0</span></div>
                <div class="resource" title="Piedra">🪨 <span id="res-stone">0</span></div>
                <div class="resource" title="Bárbaros">🗡️ <span id="res-troops">0</span></div>
                <div class="resource" title="Puntos">🏆 <span id="res-points">0</span></div>
            </div>

            <div id="base-ui">
                <div id="zoom-controls">
                    <button onclick="changeZoom(0.2)">🔍+</button>
                    <button onclick="changeZoom(-0.2)">🔍-</button>
                </div>

                <div id="action-menu">
                    <button id="btn-toggle-mode" onclick="toggleMode()">✋ Mover Mapa</button>
                    <button onclick="trainTroop()">Entrenar Bárbaro<br><small>10🪵</small></button>
                    <button id="btn-combat" onclick="startCombatMatch()">⚔️ Atacar Base</button>
                </div>

                <!-- Menú de construcción expandido -->
                <div id="build-menu">
                    <button class="build-btn" onclick="selectBuilding('lumbermill')">
                        🪚 Aserradero<br><small>20🪵 10🪨</small>
                    </button>
                    <button class="build-btn" onclick="selectBuilding('mine')">
                        ⛏️ Mina<br><small>10🪵 20🪨</small>
                    </button>
                    <button class="build-btn" onclick="selectBuilding('camp')">
                        ⛺ Campamento<br><small>50🪵 30🪨</small>
                    </button>
                    <button class="build-btn" onclick="selectBuilding('wall')">
                        🧱 Muro<br><small>10🪵 5🪨</small>
                    </button>
                    <button class="build-btn" onclick="selectBuilding('tower')">
                        🗼 Torre<br><small>20🪵 15🪨</small>
                    </button>
                </div>
            </div>

            <div id="combat-ui" class="hidden">
                <div id="combat-header">
                    <h2>🔥 ASALTO EN CURSO 🔥</h2>
                    <p>Toca las zonas exteriores para desplegar tropas</p>
                    <button onclick="endCombat()">Bandera Blanca (Rendirse)</button>
                </div>
            </div>
            
            <div id="notification-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
