<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle - HUD Limpio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            
            <!-- UI NORMAL (HUD Estilo Clash) -->
            <div id="normal-ui">
                <!-- Controles Izquierda -->
                <div id="top-left-controls">
                    <button class="icon-btn" onclick="showNotification('📜 Misiones: ¡Próximamente!')" title="Misiones">📜</button>
                    <button class="icon-btn" onclick="toggleFullScreen()" id="btn-fs" title="Pantalla Completa">🔲</button>
                </div>

                <!-- Recursos Derecha -->
                <div id="hud-resources">
                    <div class="hud-pill pill-wood">🪵 <span id="res-wood">0</span></div>
                    <div class="hud-pill pill-stone">🪨 <span id="res-stone">0</span></div>
                    <div class="hud-pill pill-coins">🪙 <span id="res-coins">0/100</span></div>
                    <div class="hud-pill pill-troops">🗡️ <span id="res-troops">0/0</span></div>
                    <div class="hud-pill pill-points">🏆 <span id="res-points">0</span></div>
                </div>

                <!-- Botones Inferiores -->
                <button id="btn-attack-hud" class="hud-btn" onclick="startCombatMatch()">⚔️ Atacar</button>
                <button id="btn-build-hud" class="hud-btn" onclick="enterBuildMode()">🔨 Construir</button>
                <button id="btn-shop-hud" class="hud-btn" onclick="openShop()">🏪 Tienda</button>
            </div>

            <!-- UI MODO CONSTRUCCIÓN (Estable y original) -->
            <div id="build-ui" class="hidden">
                <button id="btn-exit-build" onclick="exitBuildMode()">Salir del Modo</button>
                
                <div id="build-tray">
                    <button class="build-item" onclick="selectBuilding('goldmine')">
                        <span class="icon">⛏️🟡</span><br>Mina de Oro<br><small>250🪵 250🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('vault')">
                        <span class="icon">🏦</span><br>Almacén 🪙<br><small>400🪵 400🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('lumbermill')">
                        <span class="icon">🪚</span><br>Aserradero<br><small>150🪵 50🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('mine')">
                        <span class="icon">⛏️</span><br>Mina Piedra<br><small>50🪵 150🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('camp')">
                        <span class="icon">⛺</span><br>Campamento<br><small>200🪵 150🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('wall')">
                        <span class="icon">🧱</span><br>Muro<br><small>40🪵 20🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('tower')">
                        <span class="icon">🗼</span><br>Torre<br><small>150🪵 150🪨</small>
                    </button>
                </div>

                <div id="placement-controls" class="hidden">
                    <button id="btn-cancel" onclick="cancelPlacement()">❌ Cancelar</button>
                    <button id="btn-confirm" onclick="confirmPlacement()">✅ Colocar</button>
                </div>

                <div id="edit-controls" class="hidden">
                    <button id="btn-train-troop" onclick="trainTroop()" style="display:none;">🗡️ Entrenar Bárbaro</button>
                    <button id="btn-repair" onclick="repairBuilding()">🔨 Reparar</button>
                    <button id="btn-relocate" onclick="startRelocate()">🔄 Reubicar</button>
                    <button id="btn-destroy-init" onclick="initDestroy()">💥 Destruir</button>
                    <button id="btn-cancel-edit" onclick="cancelEdit()">❌ Cancelar</button>
                </div>

                <div id="ruin-controls" class="hidden">
                    <button id="btn-rebuild" onclick="rebuildBuilding()">🏗️ Reconstruir</button>
                    <button id="btn-destroy-ruin" onclick="initDestroy()">💥 Limpiar</button>
                    <button id="btn-cancel-ruin" onclick="cancelEdit()">❌ Cancelar</button>
                </div>

                <div id="destroy-controls" class="hidden">
                    <button id="btn-cancel-destroy" onclick="cancelEdit()">❌ Cancelar</button>
                    <button id="btn-confirm-destroy" onclick="confirmDestroy()">✅ Confirmar (40%)</button>
                </div>
            </div>

            <!-- UI DE COMBATE -->
            <div id="combat-ui" class="hidden">
                <div id="combat-header">
                    <h2>🔥 ASALTO EN CURSO 🔥</h2>
                    <p>Toca los bordes para soltar bárbaros</p>
                    <button onclick="surrender()">Rendirse y Retirarse</button>
                </div>
            </div>

            <!-- UI DE LA TIENDA -->
            <div id="shop-ui" class="hidden">
                <div class="shop-panel">
                    <h2>🏪 Tienda del Reino</h2>
                    <div class="shop-items">
                        <button onclick="buyExpansion()">
                            🗺️ Expandir Mapa (+5x5)<br>
                            <small>Costo: <span id="expansion-cost-text">100</span> 🪙</small>
                        </button>
                    </div>
                    <button class="close-btn" onclick="closeShop()">Cerrar Tienda</button>
                </div>
            </div>
            
            <div id="notification-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
