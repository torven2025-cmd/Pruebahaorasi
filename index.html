<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle 7.0 - Drag & Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="resource-bar">
                <div class="resource" title="Madera">🪵 <span id="res-wood">0</span></div>
                <div class="resource" title="Piedra">🪨 <span id="res-stone">0</span></div>
                <div class="resource" title="Bárbaros">🗡️ <span id="res-troops">0</span></div>
                <div class="resource" title="Puntos">🏆 <span id="res-points">0</span></div>
            </div>

            <!-- UI NORMAL -->
            <div id="normal-ui">
                <div id="zoom-controls">
                    <button onclick="changeZoom(0.2)">🔍+</button>
                    <button onclick="changeZoom(-0.2)">🔍-</button>
                </div>
                <div id="action-menu">
                    <button class="action-btn build-mode-btn" onclick="enterBuildMode()">🔨 Modo Construir</button>
                    <button class="action-btn" onclick="trainTroop()">Entrenar Bárbaro<br><small>10🪵</small></button>
                    <button class="action-btn attack-btn" onclick="startCombatMatch()">⚔️ Atacar Base</button>
                </div>
            </div>

            <!-- UI MODO CONSTRUCCIÓN (Oculta por defecto) -->
            <div id="build-ui" class="hidden">
                <button id="btn-exit-build" onclick="exitBuildMode()">Salir del Modo</button>
                
                <!-- Carrusel horizontal de edificios -->
                <div id="build-tray">
                    <button class="build-item" onclick="selectBuilding('lumbermill')">
                        <span class="icon">🪚</span><br>Aserradero<br><small>20🪵 10🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('mine')">
                        <span class="icon">⛏️</span><br>Mina<br><small>10🪵 20🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('camp')">
                        <span class="icon">⛺</span><br>Campamento<br><small>50🪵 30🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('wall')">
                        <span class="icon">🧱</span><br>Muro<br><small>10🪵 5🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('tower')">
                        <span class="icon">🗼</span><br>Torre<br><small>20🪵 15🪨</small>
                    </button>
                </div>

                <!-- Botones de Confirmación (Aparecen al seleccionar un edificio) -->
                <div id="placement-controls" class="hidden">
                    <button id="btn-cancel" onclick="cancelPlacement()">❌ Cancelar</button>
                    <button id="btn-confirm" onclick="confirmPlacement()">✅ Colocar</button>
                </div>
            </div>

            <!-- UI DE COMBATE -->
            <div id="combat-ui" class="hidden">
                <div id="combat-header">
                    <h2>🔥 ASALTO EN CURSO 🔥</h2>
                    <p>Toca los bordes para soltar bárbaros</p>
                    <button onclick="endCombat()">Rendirse</button>
                </div>
            </div>
            
            <div id="notification-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
