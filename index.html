<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Survival</title>
<style>
:root{--js:clamp(84px,27vh,116px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;font-family:"Courier New",ui-monospace,monospace;color:#f3ecd2}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.38));z-index:1}
.hud{position:fixed;z-index:5;pointer-events:none}
#stats{left:calc(8px + env(safe-area-inset-left));top:6px;width:88px}
.st{display:flex;align-items:center;gap:3px;margin-bottom:3px;font-size:9px}
.st span{width:12px;text-align:center}
.bar{flex:1;height:7px;background:#1a1410;border:1px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:100%}
#inf{font-size:9px;color:#ff6a5a;font-weight:bold;animation:bl 1s infinite;display:none}
@keyframes bl{50%{opacity:.35}}
#tops{right:calc(8px + env(safe-area-inset-right));top:6px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#tbtns{display:flex;gap:3px}
.tb{pointer-events:auto;width:36px;height:34px;background:rgba(30,22,14,.82);border:2px solid #0d0905;color:#f3ecd2;font-size:15px;line-height:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;box-shadow:inset 0 2px rgba(255,255,255,.12);font-family:inherit}
.tb small{font-size:7px;margin-top:1px}
.tb:active{background:#5a4328}
#mini{width:70px;height:70px;border:2px solid #0d0905;background:#06121f;image-rendering:pixelated;opacity:.92;pointer-events:auto}
#hotbar{left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:3px;pointer-events:auto}
.hs{position:relative;width:34px;height:34px;background:rgba(30,22,14,.8);border:2px solid #0d0905;display:flex;align-items:center;justify-content:center;border-radius:3px}
.hs.sel{border-color:#ffd04a;background:rgba(95,70,40,.92)}
.hs .num{position:absolute;left:2px;top:0;font-size:7px;opacity:.6}
.cnt{position:absolute;right:1px;bottom:0;font-size:8px;font-weight:bold;text-shadow:1px 1px #000}
.ic{image-rendering:pixelated;display:block}
#hinfo{left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:9px;text-shadow:1px 1px #000;white-space:nowrap;opacity:.9}
.stick{position:fixed;z-index:6;width:var(--js);height:var(--js);border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);bottom:calc(10px + env(safe-area-inset-bottom))}
#jl{left:calc(14px + env(safe-area-inset-left))}
#jr{right:calc(14px + env(safe-area-inset-right));display:none}
body.gun #jr{display:block}
.knob{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5);pointer-events:none}
.rb{position:fixed;z-index:6;border-radius:50%;border:2px solid #0d0905;background:rgba(160,110,40,.85);color:#fff;font:bold 9px "Courier New",monospace;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 3px rgba(255,255,255,.25);padding:0}
.rb:active{filter:brightness(1.3)}
#bAct{width:54px;height:54px;right:calc(18px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));font-size:20px}
#bUse{width:48px;height:48px;right:calc(22px + env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));display:none;background:rgba(50,130,70,.92)}
body.gun #bAct{right:calc(var(--js) + 30px)}
body.gun #bUse{right:calc(var(--js) + 34px)}
#toast{position:fixed;z-index:8;left:50%;top:8px;transform:translateX(-50%);font-size:10px;background:rgba(20,14,8,.85);border:2px solid #0d0905;padding:3px 8px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.b{pointer-events:auto;background:#5a4328;border:2px solid #0d0905;box-shadow:inset 0 -3px #3b2b18,inset 0 2px #7c5d37;color:#f3ecd2;font:bold 11px "Courier New",monospace;padding:5px 9px;border-radius:3px}
.b:active{filter:brightness(1.3)}
.b.ok{background:#2f7a3a;box-shadow:inset 0 -3px #1d4d25,inset 0 2px #4da059}
.b.no{background:#8a2f2f;box-shadow:inset 0 -3px #561c1c,inset 0 2px #b04b4b}
.b.sm{padding:3px 6px;font-size:10px}
.b:disabled{opacity:.4}
#bbar{left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:5px;background:rgba(25,18,10,.88);border:2px solid #0d0905;padding:4px 6px;border-radius:4px;pointer-events:auto;z-index:7}
#blabel{font-size:10px;max-width:34vw;line-height:1.15}
#bmenu{left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;background:rgba(25,18,10,.93);border:2px solid #0d0905;padding:5px;border-radius:4px;pointer-events:auto;z-index:7;width:min(58vw,430px)}
.tabs{display:flex;gap:3px;margin-bottom:4px;align-items:center}
.tabs .b{flex:1;padding:3px 2px;font-size:10px}
.tabs .b.act{background:#a67a30}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{flex:1 1 90px;background:#3a2c1c;border:2px solid #0d0905;padding:3px 4px;font-size:9px;border-radius:3px;line-height:1.25;pointer-events:auto}
.chip:active{background:#5a4328}
.chip b{display:block;font-size:10px}
.chip.bad{opacity:.6}
#panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
.pbox{background:#2b2118;border:3px solid #0d0905;box-shadow:inset 0 0 0 2px #5a4328;border-radius:4px;padding:8px;width:min(94vw,600px);max-height:92vh;overflow:auto;font-size:11px}
.pbox,.pbox *{touch-action:pan-y}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:bold;color:#ffd04a}
.row{display:flex;gap:10px;align-items:flex-start}
.grid{display:grid;grid-template-columns:repeat(6,32px);gap:2px}
.grid.g10{grid-template-columns:repeat(10,32px)}
.slot{position:relative;width:32px;height:32px;background:#1a1410;border:2px solid #0d0905;display:flex;align-items:center;justify-content:center}
.slot.hot{border-color:#7c5d37}
.slot.sel{border-color:#ffd04a;background:#3b2b18}
.det{flex:1;min-width:110px;font-size:11px;line-height:1.35}
.det h4{margin:0 0 3px;font-size:12px;color:#ffd04a}
.rec{display:flex;align-items:center;gap:8px;background:#1a1410;border:2px solid #0d0905;padding:4px 6px;margin-bottom:4px;border-radius:3px}
.rec .nm{flex:1;line-height:1.3}
.good{color:#7fe08a}.badc{color:#ff7b6b}
.frow{display:flex;align-items:center;gap:6px;background:#1a1410;border:2px solid #0d0905;padding:4px 6px;margin-bottom:4px;border-radius:3px}
.frow .nm{flex:1}
#start,#death{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(ellipse at center,#24402a,#0b1410);text-align:center}
#death{display:none;z-index:40;background:rgba(60,0,0,.8)}
#start h1{margin:0;font-size:clamp(22px,7vh,40px);color:#ffd04a;text-shadow:3px 3px #000;letter-spacing:2px}
#start p{margin:0;font-size:11px;opacity:.8;max-width:70vw}
#rot{position:fixed;inset:0;z-index:99;background:#0b0f14;display:none;align-items:center;justify-content:center;text-align:center;font-size:16px;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>

<div id="stats" class="hud">
  <div class="st"><span>❤</span><div class="bar"><i id="bHp" style="background:#d9382c"></i></div></div>
  <div class="st"><span>🍖</span><div class="bar"><i id="bFood" style="background:#d9902c"></i></div></div>
  <div class="st"><span>💧</span><div class="bar"><i id="bWater" style="background:#2c9ad9"></i></div></div>
  <div id="inf">☣ INFECTADO</div>
</div>

<div id="tops" class="hud">
  <div id="tbtns">
    <button class="tb" id="bInv">🎒<small>Inv.</small></button>
    <button class="tb" id="bCraft">⚒<small>Craft</small></button>
    <button class="tb" id="bBuild">🏠<small>Const.</small></button>
    <button class="tb" id="bMap">🗺<small>Mapa</small></button>
    <button class="tb" id="bMenu">⚙<small>Menú</small></button>
  </div>
  <canvas id="mini" width="64" height="64"></canvas>
</div>

<div id="hinfo" class="hud"></div>
<div id="hotbar" class="hud"></div>

<div id="jl" class="stick"><div class="knob"></div></div>
<div id="jr" class="stick"><div class="knob"></div></div>
<button id="bAct" class="rb">⚒</button>
<button id="bUse" class="rb">Usar</button>

<div id="bmenu" class="hud"></div>
<div id="bbar" class="hud">
  <span id="blabel"></span>
  <button id="bRot" class="b sm">⟳ Girar</button>
  <button id="bOk" class="b ok sm">✔ Confirmar</button>
  <button id="bNo" class="b no sm">✖ Cancelar</button>
</div>

<div id="toast"></div>
<div id="panel"><div class="pbox" id="pbox"></div></div>

<div id="death">
  <h1 style="color:#ff6a5a;margin:0">HAS MUERTO</h1>
  <p style="margin:0;font-size:12px">Pierdes tu inventario, pero tu base sigue en pie.</p>
  <button class="b" id="bRespawn" style="font-size:14px;padding:8px 18px">Reaparecer</button>
</div>

<div id="start">
  <h1>PIXEL SURVIVAL</h1>
  <p>Sobrevive: farmea, construye tu base, funde metal y arma una pistola de clavos.</p>
  <button class="b" id="bPlay" style="font-size:15px;padding:9px 22px">▶ Jugar</button>
  <button class="b" id="bCont" style="display:none">Continuar partida</button>
  <p style="font-size:9px;opacity:.6">Mejor en horizontal · Pantalla completa desde ⚙ Menú</p>
</div>
<div id="rot">📱↻<br>Gira tu dispositivo a horizontal para jugar</div>

<script>
(()=>{
'use strict';
/* ================= CONSTANTES / UTIL ================= */
const T=16,MW=320,MH=320,HOT=6,NSLOT=30;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // N E S W
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(seed){
  const r=mulberry(seed),P=new Float32Array(65536);for(let i=0;i<65536;i++)P[i]=r();
  const s=t=>t*t*(3-2*t);
  function n(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const a=P[((yi&255)<<8)|(xi&255)],b=P[((yi&255)<<8)|((xi+1)&255)],c=P[(((yi+1)&255)<<8)|(xi&255)],d=P[(((yi+1)&255)<<8)|((xi+1)&255)];
    const u=s(xf),v=s(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
  return (x,y,o)=>{let amp=1,f=1,sum=0,nm=0;for(let i=0;i<(o||4);i++){sum+=n(x*f,y*f)*amp;nm+=amp;amp*=.5;f*=2}return sum/nm}
}
const fmt=n=>n>=10000?Math.floor(n/1000)+'k':String(n);

/* ================= AUDIO ================= */
const AU={ctx:null,on:true,master:null,nbuf:null};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.6;AU.master.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate,b=AU.ctx.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.nbuf=b}catch(e){AU.ctx=null}
}
function tone(type,f0,f1,dur,vol,delay){
  if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.05)
}
function noise(dur,vol,ft,fq,q,delay){
  if(!AU.ctx||!AU.on||!AU.nbuf)return;const c=AU.ctx,t=c.currentTime+(delay||0);
  const s=c.createBufferSource();s.buffer=AU.nbuf;const f=c.createBiquadFilter();f.type=ft;f.frequency.value=fq;f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.4,dur+.05)
}
const SFX={
  wood(){noise(.09,.55,'lowpass',500,1);tone('sine',140,60,.12,.55);tone('triangle',230,110,.06,.2)},
  woodBreak(){noise(.3,.55,'lowpass',700,1);tone('sine',100,40,.32,.6);noise(.12,.3,'bandpass',900,2,.14);tone('sine',80,35,.2,.5,.16)},
  stone(){noise(.07,.55,'highpass',1800,1);tone('square',320,160,.06,.16);tone('square',180,90,.09,.14,.03)},
  stoneBreak(){SFX.stone();noise(.25,.45,'bandpass',1200,1,.08);tone('square',120,50,.25,.2,.1)},
  metal(){tone('sine',880,860,.5,.3);tone('sine',1320,1300,.4,.2);tone('square',2400,1800,.03,.1);noise(.03,.35,'highpass',4000)},
  metalBreak(){SFX.metal();tone('sine',660,640,.7,.25,.12);tone('sine',990,970,.6,.15,.12)},
  sulfur(){for(let i=0;i<5;i++)noise(.035,.4,'bandpass',2500+Math.random()*2500,3,i*.028);tone('sawtooth',720,300,.13,.1)},
  sulfurBreak(){SFX.sulfur();for(let i=0;i<6;i++)noise(.04,.35,'bandpass',1800+Math.random()*3000,3,.15+i*.03)},
  barrel(){tone('triangle',200,120,.2,.4);noise(.15,.4,'bandpass',900,2);tone('square',420,400,.05,.1)},
  barrelBreak(){SFX.barrel();noise(.35,.45,'bandpass',600,1,.08);tone('triangle',150,60,.3,.3,.1)},
  swing(){noise(.12,.15,'bandpass',1200,.8)},
  shoot(){tone('square',900,120,.12,.22);noise(.06,.3,'highpass',2500)},
  nailHit(){noise(.04,.3,'highpass',3000);tone('triangle',1400,900,.04,.1)},
  hurt(){tone('sawtooth',220,70,.25,.3);noise(.12,.3,'lowpass',800)},
  animal(){tone('sawtooth',300,120,.22,.2);tone('square',160,80,.18,.1)},
  eat(){for(let i=0;i<3;i++){noise(.07,.35,'lowpass',900,1,i*.12);tone('sine',200,120,.06,.2,i*.12)}},
  drink(){for(let i=0;i<4;i++)tone('sine',300+i*80,500+i*100,.08,.18,i*.07)},
  bandage(){noise(.25,.35,'highpass',2000);noise(.18,.3,'highpass',3000,1,.2)},
  pickup(){tone('square',600,900,.06,.12);tone('square',900,1200,.06,.12,.06)},
  place(){tone('sine',110,50,.2,.5);noise(.1,.4,'lowpass',600);tone('square',500,300,.04,.1,.06)},
  door(){tone('sawtooth',130,95,.3,.14);noise(.2,.12,'lowpass',500)},
  click(){tone('square',700,500,.04,.1)},
  craft(){tone('square',500,700,.07,.15);tone('square',700,1000,.09,.15,.08);noise(.05,.2,'highpass',3000,1,.02)},
  err(){tone('square',200,140,.12,.15)}
};
const sfx=n=>{try{SFX[n]&&SFX[n]()}catch(e){}};

/* ================= SPRITES (pixelart procedural) ================= */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const r=(a,b,cw,ch,col)=>{x.fillStyle=col;x.fillRect(a,b,cw,ch)};f(x,r);return c}
function mkTile(base,c1,c2,n,seed){return mk(16,16,(x,r)=>{r(0,0,16,16,base);const rn=mulberry(seed);for(let i=0;i<n;i++)r(rn()*16|0,rn()*16|0,1+(rn()*2|0),1,rn()<.5?c1:c2)})}
function mkWater(i){return mk(16,16,(x,r)=>{r(0,0,16,16,'#2d6cb0');for(let a=0;a<3;a++){r((i*5+a*7)%12,a*5+2+(i&1),4,1,'#4f96d8');r((i*3+a*5+6)%13,a*5+4,2,1,'#245c9a')}})}
const TILES={
  grass:[1,2,3,4,5,6].map(i=>mkTile('#4f9a3f','#43873a','#5bab49',22,i)),
  dgrass:[1,2,3,4,5,6].map(i=>mkTile('#3d7f34','#336c2c','#4a9040',22,i+11)),
  sand:[1,2,3].map(i=>mkTile('#d9c47e','#c8b26a','#e6d493',14,i+21)),
  dirt:[1,2,3,4].map(i=>mkTile('#7e756a','#6c645a','#908679',24,i+31)),
  water:[0,1,2,3].map(mkWater)
};
const TSET=[TILES.water,TILES.sand,TILES.grass,TILES.dirt,TILES.dgrass];
const DECO=[null,
  mk(16,16,(x,r)=>{r(4,9,1,3,'#2f6b28');r(7,8,1,4,'#2f6b28');r(10,9,1,3,'#2f6b28');r(6,10,1,2,'#3d8a34')}),
  mk(16,16,(x,r)=>{r(8,9,1,4,'#2f6b28');r(7,7,3,3,'#e04848');r(8,8,1,1,'#ffe36a')}),
  mk(16,16,(x,r)=>{r(5,9,1,4,'#2f6b28');r(4,7,3,3,'#f2d23a');r(5,8,1,1,'#fff')}),
  mk(16,16,(x,r)=>{r(6,9,4,3,'#8d8d95');r(7,9,2,1,'#b9b9c4');r(6,11,4,1,'#5f5f68')})
];
const SPR={};
SPR.tree=mk(16,24,(x,r)=>{
  r(5,22,6,1,'rgba(0,0,0,.25)');r(6,15,4,8,'#6b4423');r(6,15,1,8,'#52331a');r(9,17,1,6,'#7d5230');
  const g1='#2f7a2c',g2='#43a03b',g3='#215c20';
  r(3,5,10,10,g1);r(5,2,6,4,g1);r(2,8,12,5,g1);
  r(4,4,3,3,g2);r(8,6,3,3,g2);r(3,10,3,2,g2);r(6,3,3,1,g2);
  r(9,11,4,3,g3);r(5,13,5,2,g3);r(11,8,2,2,g3);r(3,13,3,1,g3)
});
function mkOre(c1,c2,c3,spec){return mk(16,16,(x,r)=>{
  r(3,14,10,1,'rgba(0,0,0,.25)');r(3,5,10,9,c1);r(5,3,6,3,c1);r(2,7,12,5,c1);
  r(3,11,10,3,c2);r(5,13,7,1,c2);r(5,4,4,2,c3);r(4,6,3,2,c3);r(3,8,1,2,c3);spec(x,r)})}
SPR.stone=mkOre('#8b8b96','#62626d','#b9b9c6',(x,r)=>{r(9,8,1,3,'#5a5a64');r(10,10,2,1,'#5a5a64')});
SPR.sulfur=mkOre('#85858f','#5e5e69','#aaaab6',(x,r)=>{r(8,5,2,4,'#f2dd3c');r(10,8,2,3,'#f2dd3c');r(5,9,2,3,'#d9c42a');r(8,5,1,1,'#fff7a0');r(10,8,1,1,'#fff7a0')});
SPR.metal=mkOre('#6a6f7c','#464b57','#8c93a3',(x,r)=>{r(9,6,2,2,'#d9803a');r(5,8,2,2,'#d9803a');r(10,10,3,1,'#a9b6c8');r(4,11,2,1,'#e8a560');r(7,5,1,1,'#b8c4d6')});

  if(isInv&&!hotPref(id)){order=[];for(let i=HOT;i<arr.length;i++)order.push(i);for(let i=0;i<HOT;i++)order.push(i)}

  return n;

  const nE=makeNoise(sd),nM=makeNoise(sd+7),nF=makeNoise(sd+13),nL=makeNoise(sd+29),rnd=mulberry(sd*7+1);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    let e=nE(x/55,y/55,5);
    const dx=(x/MW-.5)*2,dy=(y/MH-.5)*2,d=Math.max(Math.abs(dx),Math.abs(dy));
    e=e-Math.pow(d,3.2)*.45+.04;
    let t;

    const i=y*MW+x,t=tile[i];
    if(t===2||t===4){
      const f=nF(x/18,y/18,3);
      const p=t===4?(f>.5?.04:.01):(f>.58?.02:.002);
      if(rnd()<p)placeRes('tree',x,y);

      if(q<.006)placeRes('stone',x,y);else if(q<.0082)placeRes('sulfur',x,y);else if(q<.0104)placeRes('metal',x,y);else if(rnd()<.05)deco[i]=4;
    }else if(t===1){if(rnd()<.004)deco[i]=4}
    if(!res[i]&&t!==0&&rnd()<.0009){placeRes('barrel',x,y);if(rnd()<.5){const nx=x+(rnd()<.5?1:-1);if(!res[y*MW+nx]&&tile[y*MW+nx]!==0)placeRes('barrel',nx,y)}}
  }
  // spawn: cerca del centro, en hierba y cerca de agua
  const near=(x,y,r)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const xx=x+i,yy=y+j;if(xx>=0&&yy>=0&&xx<MW&&yy<MH&&tile[yy*MW+xx]===0)return true}return false};
  let sp=null;const cx=MW>>1,cy=MH>>1;
  for(let r=0;r<110&&!sp;r+=2){for(let a=0;a<r*8+1&&!sp;a++){
    const ang=a/(r*8+1)*Math.PI*2,x=Math.round(cx+Math.cos(ang)*r),y=Math.round(cy+Math.sin(ang)*r);
    if(x>8&&y>8&&x<MW-8&&y<MH-8&&(tile[y*MW+x]===2||tile[y*MW+x]===4)&&!res[y*MW+x]&&near(x,y,9))sp={x,y}}}
  if(!sp){for(let r=0;r<110&&!sp;r+=2){for(let a=0;a<r*8+1&&!sp;a++){
    const ang=a/(r*8+1)*Math.PI*2,x=Math.round(cx+Math.cos(ang)*r),y=Math.round(cy+Math.sin(ang)*r);
    if(x>8&&y>8&&x<MW-8&&y<MH-8&&tile[y*MW+x]===2&&!res[y*MW+x])sp={x,y}}}}
  if(!sp)sp={x:cx,y:cy};
  spawn={x:sp.x*T+8,y:sp.y*T+8};
  const scatter=(t,n,rmin,rmax)=>{let tries=0;while(n>0&&tries++<300){const a=rnd()*6.283,d=rmin+rnd()*(rmax-rmin),x=Math.round(sp.x+Math.cos(a)*d),y=Math.round(sp.y+Math.sin(a)*d);
    if(freeLand(x,y)&&tile[y*MW+x]!==0){const o=res[y*MW+x];if(!o){placeRes(t,x,y);n--}}}};
  scatter('tree',6,4,10);scatter('stone',3,5,10);scatter('sulfur',1,6,11);scatter('metal',1,6,11);scatter('cloth',3,3,9);scatter('barrel',2,5,10);
  res[sp.y*MW+sp.x]=null;
  buildMini();
}
function buildMini(){
  mini=document.createElement('canvas');mini.width=MW;mini.height=MH;const c=mini.getContext('2d');
  const im=c.createImageData(MW,MH),col={0:[47,111,179],1:[217,196,126],2:[74,140,58],3:[125,116,104],4:[58,115,48]};

/* ================= COLISIONES / ESTRUCTURAS ================= */
const ek=(x,y,t)=>(y*(MW+1)+x)*2+t;
function edgeFromTile(tx,ty,e){if(e===0)return{x:tx,y:ty,t:0};if(e===2)return{x:tx,y:ty+1,t:0};if(e===3)return{x:tx,y:ty,t:1};return{x:tx+1,y:ty,t:1}}
const edgeRect=(x,y,t)=>t===0?[x*T-2,y*T-2,T+4,5]:[x*T-2,y*T-2,5,T+4];
const solidEdge=p=>p.k==='wall'||(p.k==='door'&&!p.open);
function boxHitsEdges(x0,y0,x1,y1){
  if(!edges.size)return false;
  const tx0=Math.floor(x0/T)-1,tx1=Math.floor(x1/T)+1,ty0=Math.floor(y0/T)-1,ty1=Math.floor(y1/T)+1;
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    let p=edges.get(ek(tx,ty,0));
    if(p&&solidEdge(p)){const r=edgeRect(tx,ty,0);if(x1>r[0]&&x0<r[0]+r[2]&&y1>r[1]&&y0<r[1]+r[3])return true}
    p=edges.get(ek(tx,ty,1));
    if(p&&solidEdge(p)){const r=edgeRect(tx,ty,1);if(x1>r[0]&&x0<r[0]+r[2]&&y1>r[1]&&y0<r[1]+r[3])return true}
  }
  return false;
}
function tileSolid(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH)return true;const i=ty*MW+tx;
  if(tile[i]===0)return true;const r=res[i];if(r&&!r.dead&&r.t!=='cloth')return true;
  return furn.has(i);
}
function blocked(x,y,r){
  const x0=x-r,x1=x+r-.01,y0=y-r,y1=y+r-.01;
  const tx0=Math.floor(x0/T),tx1=Math.floor(x1/T),ty0=Math.floor(y0/T),ty1=Math.floor(y1/T);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)if(tileSolid(tx,ty))return true;
  return boxHitsEdges(x0,y0,x1,y1);
}
function moveEnt(e,dx,dy){
  let hit=false;
  if(dx){const nx=e.x+dx;if(!blocked(nx,e.y,e.r))e.x=nx;else hit=true}
  if(dy){const ny=e.y+dy;if(!blocked(e.x,ny,e.r))e.y=ny;else hit=true}
  return hit;
}
function pointSolid(x,y){
  const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return true;
  const i=ty*MW+tx,r=res[i];if(r&&!r.dead&&r.t!=='cloth')return true;if(furn.has(i))return true;
  return boxHitsEdges(x-.5,y-.5,x+.5,y+.5);
}
function animalAt(x,y){for(const a of animals)if(!a.dead&&Math.abs(a.x-x)<6&&Math.abs(a.y-y)<6)return a;return null}
function rayEnd(ox,oy,dx,dy,max){let x=ox,y=oy;for(let d=0;d<max;d+=3){x+=dx*3;y+=dy*3;if(pointSolid(x,y)||animalAt(x,y))return[x,y,true]}return[x,y,false]}

/* ================= ANIMALES ================= */
const AN={
 deer:{hp:60,spd:22,flee:64,drop:[4,6]},
 boar:{hp:90,spd:22,chase:56,dmg:10,drop:[5,8]},
 wolf:{hp:110,spd:25,chase:63,dmg:12,aggro:115,drop:[6,9]}
};
function spawnAnimal(init){
  for(let k=0;k<50;k++){
    const tx=ri(4,MW-5),ty=ri(4,MH-5),i=ty*MW+tx,t=tile[i];
    if(t<2||res[i]||furn.has(i))continue;
    const x=tx*T+8,y=ty*T+8,d=Math.hypot(x-(init?spawn.x:P.x),y-(init?spawn.y:P.y));
    if(d<(init?280:340))continue;
    const q=Math.random(),kind=t===4?(q<.35?'wolf':q<.6?'boar':'deer'):(q<.6?'deer':q<.85?'boar':'wolf');
    animals.push({k:kind,x,y,r:4,hp:AN[kind].hp,vx:0,vy:0,t:0,face:1,anim:0,hurt:0,atk:0,aggro:0,dead:false,moving:false});
    return;
  }
}
function hurtPlayer(n){if(P.dead)return;P.hp-=n;P.hurt=.3;sfx('hurt');if(P.hp<=0)die()}
function damageAnimal(a,n){
  a.hp-=n;a.hurt=3;a.aggro=10;sfx('animal');
  for(let i=0;i<5;i++)parts.push({x:a.x,y:a.y,vx:rand(-30,30),vy:rand(-40,10),life:.5,col:'#b3261e',sz:1.5});
  if(a.hp<=0){
    a.dead=true;const d=AN[a.k].drop;const n2=ri(d[0],d[1]);
    drops.push({x:a.x,y:a.y,id:'raw_meat',n:n2,t:0,nopick:.6});
    for(let i=0;i<10;i++)parts.push({x:a.x,y:a.y,vx:rand(-50,50),vy:rand(-50,20),life:.7,col:'#8c1d18',sz:2});
  }
}
function updAnimals(dt){
  for(const a of animals){
    if(a.dead)continue;
    const dx=P.x-a.x,dy=P.y-a.y,d=Math.hypot(dx,dy);
    if(d>520)continue;
    a.hurt=Math.max(0,a.hurt-dt);a.atk=Math.max(0,a.atk-dt);a.aggro=Math.max(0,a.aggro-dt);a.t-=dt;
    const def=AN[a.k];let vx=a.vx,vy=a.vy,mode='wander';
    if(a.k==='deer'){if(d<80||a.hurt>0){mode='flee';const l=d||1;vx=-dx/l*def.flee;vy=-dy/l*def.flee;a.t=.4}}
    else if(a.k==='boar'){if(a.aggro>0&&d<260){mode='chase'}}
    else{if((d<def.aggro&&!P.dead)||(a.aggro>0&&d<260))mode='chase'}
    if(mode==='chase'&&!P.dead){
      const l=d||1;
      if(d<11){vx=vy=0;if(a.atk<=0){a.atk=1.1;hurtPlayer(def.dmg)}}
      else{vx=dx/l*def.chase;vy=dy/l*def.chase}
      a.t=.3;
    }else if(mode==='wander'&&a.t<=0){
      a.t=rand(1.5,4);
      if(Math.random()<.4){vx=vy=0}else{const an=Math.random()*6.283,sp=def.spd;vx=Math.cos(an)*sp;vy=Math.sin(an)*sp}
    }
    a.vx=vx;a.vy=vy;
    if(vx||vy){const hit=moveEnt(a,vx*dt,vy*dt);if(hit&&mode==='wander')a.t=0;a.moving=true;a.anim+=dt;if(Math.abs(vx)>.1)a.face=vx>0?1:3}else a.moving=false;
  }
  if(animals.some(a=>a.dead))animals=animals.filter(a=>!a.dead);
}

const YIELD={tree:{hatchet:1000,rock:600},stone:{pickaxe:600,rock:100},sulfur:{pickaxe:300,rock:150},metal:{pickaxe:800}};
const ITEM_OF={tree:'wood',stone:'stone',sulfur:'sulfur_ore',metal:'metal_ore'};
const PCOL={tree:'#9b6b3a',stone:'#9a9aa5',sulfur:'#e6d23a',metal:'#d98a3d',barrel:'#b34a2a'};
const DMG={rock:8,hatchet:22,pickaxe:16};
function puff(r,n,big){for(let i=0;i<n;i++)parts.push({x:r.x*T+8,y:r.y*T+8,vx:rand(-45,45),vy:rand(-55,10),life:rand(.3,.7),col:PCOL[r.t]||'#ccc',sz:big?2:1.5})}
function hitRes(r,tool){
  if(r.t==='barrel'){hitBarrel(r,1);return}
  const y=YIELD[r.t]&&YIELD[r.t][tool];
  if(!y){sfx('err');if(time-lastToast>1){lastToast=time;toast(r.t==='tree'?'Necesitas un hacha o una roca':r.t==='metal'?'Necesitas un pico':'Necesitas un pico o una roca')}return}
  r.hp--;r.shake=.2;puff(r,6);
  if(r.hp<=0){sfx(r.t==='tree'?'woodBreak':r.t==='stone'?'stoneBreak':r.t==='metal'?'metalBreak':'sulfurBreak');puff(r,14,true);breakRes(r)}
  else sfx(r.t==='tree'?'wood':r.t==='stone'?'stone':r.t==='metal'?'metal':'sulfur');
  give(ITEM_OF[r.t],y);
}
function breakRes(r){r.dead=true;r.respawn=time+(r.t==='tree'?200:r.t==='barrel'?300:260);resDead.push(r)}
function hitBarrel(r,dmg){
  r.hp-=dmg;r.shake=.2;puff(r,5);
  if(r.hp<=0){
    sfx('barrelBreak');puff(r,14,true);breakRes(r);
    const sc=ri(5,15);dropAt(r,'scrap',sc);
    if(Math.random()<.3)dropAt(r,'cloth',ri(2,5));
    if(Math.random()<.25)dropAt(r,'nails',ri(8,16));
  }else sfx('barrel');
}
function dropAt(r,id,n){drops.push({x:r.x*T+8+rand(-6,6),y:r.y*T+8+rand(-4,6),id,n,t:0,nopick:.3})}
function meleeTarget(){
  const [fx,fy]=DIRS[P.face];let best=null,bd=1e9;
  for(const a of animals){if(a.dead)continue;const dx=a.x-P.x,dy=a.y-P.y,d=Math.hypot(dx,dy);if(d<22&&(dx*fx+dy*fy)>-4&&d<bd){best=a;bd=d}}
  if(best)return{a:best};
  for(const dd of [10,17,23])for(const o of [0,-6,6]){
    const px=P.x+fx*dd-fy*o,py=P.y+fy*dd+fx*o,tx=Math.floor(px/T),ty=Math.floor(py/T);
    if(tx<0||ty<0||tx>=MW||ty>=MH)continue;const r=res[ty*MW+tx];if(r&&!r.dead&&r.t!=='cloth')return{r};
  }
  return null;
}
function useItem(i){
  const it=inv[i];if(!it)return;
  if(it.id==='raw_meat'){P.food=Math.min(100,P.food+10);if(!P.inf){P.inf=true;toast('☣ Te infectaste por comer carne cruda')}sfx('eat')}
  else if(it.id==='cooked_meat'){if(P.food>=99){toast('No tienes hambre');return}P.food=Math.min(100,P.food+35);P.hp=Math.min(100,P.hp+5);sfx('eat')}
  else if(it.id==='bandage'){if(P.hp>=100&&!P.inf){toast('No lo necesitas');return}P.hp=Math.min(100,P.hp+25);if(P.inf){P.inf=false;toast('Infección curada')}sfx('bandage')}
  else return;
  it.n--;if(it.n<=0)inv[i]=null;uiDirty=true;
}
function fireGun(){
  if(P.gcool>0||P.dead)return;
  if(countIn(inv,'nails')<1){if(time-lastToast>.8){lastToast=time;toast('Sin clavos')}sfx('err');P.gcool=.3;return}
  takeFrom(inv,'nails',1);uiDirty=true;P.gcool=.24;sfx('shoot');
  const [ax,ay]=P.aim;bullets.push({x:P.x+ax*7,y:P.y-1+ay*7,dx:ax,dy:ay,sp:300,d:0,dead:false});
  parts.push({x:P.x+ax*8,y:P.y-1+ay*8,vx:ax*20,vy:ay*20,life:.12,col:'#ffd27a',sz:2});
}
function doAction(press){
  if(P.dead||modal)return;
  const it=held();if(!it)return;const def=IT[it.id];
  if(def.use){if(press)useItem(P.sel);return}
  if(def.gun){fireGun();return}
  if(!def.tool||P.cool>0)return;
  P.cool=.42;P.swing=.25;sfx('swing');
  const tg=meleeTarget();
  if(tg){if(tg.a)damageAnimal(tg.a,DMG[it.id]||8);else hitRes(tg.r,it.id)}
}
function updBullets(dt){
  for(const b of bullets){
    const steps=Math.ceil(b.sp*dt/3),sd=b.sp*dt/steps;
    for(let i=0;i<steps&&!b.dead;i++){
      b.x+=b.dx*sd;b.y+=b.dy*sd;b.d+=sd;
      if(b.d>200){b.dead=true;break}
      const tx=Math.floor(b.x/T),ty=Math.floor(b.y/T);
      if(tx<0||ty<0||tx>=MW||ty>=MH){b.dead=true;break}
      const r=res[ty*MW+tx];
      if(r&&!r.dead&&r.t!=='cloth'){if(r.t==='barrel')hitBarrel(r,1);else{sfx('nailHit');r.shake=.1}spark(b.x,b.y);b.dead=true;break}
      if(furn.has(ty*MW+tx)||boxHitsEdges(b.x-.5,b.y-.5,b.x+.5,b.y+.5)){sfx('nailHit');spark(b.x,b.y);b.dead=true;break}
      const a=animalAt(b.x,b.y);if(a){damageAnimal(a,25);sfx('nailHit');b.dead=true;break}
    }
  }
  if(bullets.some(b=>b.dead))bullets=bullets.filter(b=>!b.dead);
}
function spark(x,y){for(let i=0;i<4;i++)parts.push({x,y,vx:rand(-40,40),vy:rand(-40,40),life:.25,col:'#ffe08a',sz:1})}

/* ================= CONSTRUCCIÓN ================= */
function buildCost(){
  if(B.type==='wall')return TIER[B.tier].cost;
  if(B.type==='door')return DOORS[B.tier].cost;
  if(FCOST[B.type])return FCOST[B.type].cost;
  return null;
}
function buildName(){
  if(B.type==='wall')return 'Pared de '+TIER[B.tier].n.toLowerCase();
  if(B.type==='door')return 'Puerta de '+DOORS[B.tier].n.toLowerCase();
  if(B.type==='demo')return 'Demoler';
  return FCOST[B.type].n;
}
function startBuild(type,tier){
  B.on=true;B.type=type;B.tier=tier||0;B.rot=0;B.manual=null;
  $('bbar').style.display='flex';$('bmenu').style.display='none';
  $('bRot').style.display=(type==='wall'||type==='door')?'':'none';
  sfx('click');
}
function stopBuild(){B.on=false;$('bbar').style.display='none'}
function overlapsPlayer(x,y,w,h){return P.x+P.r>x&&P.x-P.r<x+w&&P.y+P.r>y&&P.y-P.r<y+h}
function pieceAt(tx,ty,e){
  const ed=edgeFromTile(tx,ty,e),p=edges.get(ek(ed.x,ed.y,ed.t));
  if(p)return{p,kind:'edge',key:ek(ed.x,ed.y,ed.t)};
  const f=furn.get(ty*MW+tx);if(f)return{p:f,kind:'furn',key:ty*MW+tx};
  return null;
}
function updGhost(){
  if(!B.on)return;
  let tx,ty,e;
  if(B.manual){tx=B.manual.tx;ty=B.manual.ty;e=B.manual.e}
  else{const [fx,fy]=DIRS[P.face];tx=Math.floor((P.x+fx*18)/T);ty=Math.floor((P.y+fy*18)/T);e=(P.face+2+B.rot)%4}
  B.tx=tx;B.ty=ty;B.e=e;B.target=null;
  let ok=true,msg='';
  const cost=buildCost();B.cost=cost;
  if(tx<0||ty<0||tx>=MW||ty>=MH||tile[ty*MW+tx]===0){ok=false;msg='Terreno inválido'}
  else if(Math.hypot(tx*T+8-P.x,ty*T+8-P.y)>T*7){ok=false;msg='Muy lejos'}
  else if(B.type==='wall'||B.type==='door'){
    const ed=edgeFromTile(tx,ty,e),ex=edges.get(ek(ed.x,ed.y,ed.t));
    if(ex){if(ex.k==='door'){ok=false;msg='Ya hay una puerta'}else if(B.type==='wall'&&ex.tier>=B.tier){ok=false;msg='Ya hay una pared'}}
    if(ok){const r=edgeRect(ed.x,ed.y,ed.t);if(overlapsPlayer(r[0],r[1],r[2],r[3])){ok=false;msg='Estás en medio'}}
  }else if(B.type==='demo'){
    const pc=pieceAt(tx,ty,e);
    if(!pc){ok=false;msg='Nada que demoler'}
    else{B.target=pc;if(pc.kind==='furn'&&hasContents(pc.p)){ok=false;msg='Vacíalo primero'}}
  }else{
    const i=ty*MW+tx,r=res[i];
    if((r&&!r.dead&&r.t!=='cloth')||furn.has(i)){ok=false;msg='Lugar ocupado'}
    else if(overlapsPlayer(tx*T,ty*T,T,T)){ok=false;msg='Estás en medio'}
  }
  if(ok&&cost&&!canPay(cost)){ok=false;msg='Faltan recursos'}
  B.valid=ok;B.msg=msg;
  const lab=$('blabel');
  const cs=cost?Object.keys(cost).map(k=>cost[k]+' '+(RN[k]||k)).join(' + '):'';
  const html=`<b>${buildName()}</b>${cs?'<br>'+cs:''}${msg?'<br><span class="badc">'+msg+'</span>':''}`;
  if(lab._h!==html){lab._h=html;lab.innerHTML=html}
  $('bOk').disabled=!ok;
}
function hasContents(p){
  if(p.slots&&p.slots.some(s=>s))return true;
  if(p.type==='furnace'){for(const k in p.inp)if(p.inp[k]>0)return true;for(const k in p.out)if(p.out[k]>0)return true;if(p.fuel>=1)return true}
  return false;
}
function mkFurnPiece(type,tx,ty){
  const p={type,tx,ty,hp:type==='furnace'?400:300,mx:type==='furnace'?400:300};
  if(type==='chest')p.slots=new Array(24).fill(null);
  if(type==='cupboard'){p.slots=new Array(8).fill(null);p.auth=true}
  if(type==='furnace'){p.inp={metal_ore:0,sulfur_ore:0,raw_meat:0};p.out={metal:0,sulfur:0,cooked_meat:0};p.acc={metal_ore:0,sulfur_ore:0,raw_meat:0};p.fuel=0;p.on=false}
  return p;
}
function registerFurn(p){if(p.type==='furnace')furnaces.push(p);if(p.type==='cupboard')cups.push(p)}
function confirmBuild(){
  if(!B.on||!B.valid)return;
  const cost=buildCost();
  if(B.type==='demo'){
    const t=B.target;if(!t)return;
    const c=t.kind==='edge'?(t.p.k==='door'?DOORS[t.p.tier].cost:TIER[t.p.tier].cost):FCOST[t.p.type].cost;
    for(const k in c)give(k,Math.floor(c[k]/2),true);
    destroyPiece(t.p,true);sfx('place');toast('Demolido (50% devuelto)');return;
  }
  pay(cost);
  if(B.type==='wall'||B.type==='door'){
    const ed=edgeFromTile(B.tx,B.ty,B.e),isD=B.type==='door';
    const hp=TIER[B.tier].hp*(isD?.6:1);
    edges.set(ek(ed.x,ed.y,ed.t),{k:isD?'door':'wall',tier:B.tier,hp,mx:hp,open:false,x:ed.x,y:ed.y,t:ed.t});
  }else{
    const p=mkFurnPiece(B.type,B.tx,B.ty);furn.set(B.ty*MW+B.tx,p);registerFurn(p);
  }
  sfx('place');
  for(let i=0;i<6;i++)parts.push({x:B.tx*T+8,y:B.ty*T+8,vx:rand(-30,30),vy:rand(-30,10),life:.4,col:'#d9c89a',sz:1.5});
  uiDirty=true;
}
function pieceKey(p){return p.k?ek(p.x,p.y,p.t):p.ty*MW+p.tx}
function destroyPiece(p,silent){
  if(p.k)edges.delete(ek(p.x,p.y,p.t));
  else{
    furn.delete(p.ty*MW+p.tx);furnaces=furnaces.filter(f=>f!==p);cups=cups.filter(f=>f!==p);
    if(p.slots)for(const s of p.slots)if(s)drops.push({x:p.tx*T+8+rand(-5,5),y:p.ty*T+8+rand(-5,5),id:s.id,n:s.n,t:0,nopick:.5});
  }
  if(!silent){sfx('woodBreak');toast('Una pieza de tu base se derrumbó')}
}
/* mantenimiento: cada 30 s */
function pieceUpkeep(p){if(p.k){const t=p.tier;return t===0?['wood',10]:t===1?['wood',20]:t===2?['stone',20]:['metal',20]}return['wood',10]}
function pieceCenter(p){return p.k?(p.t===0?[p.x*T+8,p.y*T]:[p.x*T,p.y*T+8]):[p.tx*T+8,p.ty*T+8]}
const UP_R=T*22;
function upkeepTick(){
  const all=[...edges.values(),...furn.values()];if(!all.length)return;
  const covered=new Set();
  for(const c of cups){
    const mine=[];
    for(const p of all){if(covered.has(p))continue;const pc=pieceCenter(p);if(Math.hypot(pc[0]-(c.tx*T+8),pc[1]-(c.ty*T+8))<=UP_R)mine.push(p)}
    const need={};for(const p of mine){const [r,n]=pieceUpkeep(p);need[r]=(need[r]||0)+n}
    let ok=true;for(const k in need)if(countIn(c.slots,k)<need[k])ok=false;
    if(ok){for(const k in need)takeFrom(c.slots,k,need[k]);for(const p of mine)covered.add(p)}
  }
  for(const p of all){
    if(covered.has(p))continue;
    p.hp-=p.mx*((p.k&&p.tier===0)?.06:.03);
    if(p.hp<=0)destroyPiece(p);
  }
  if(modal==='cupboard')renderPanel();
}
function cupInfo(c){
  let n=0;const need={};
  for(const p of [...edges.values(),...furn.values()]){const pc=pieceCenter(p);if(Math.hypot(pc[0]-(c.tx*T+8),pc[1]-(c.ty*T+8))<=UP_R){n++;const [r,v]=pieceUpkeep(p);need[r]=(need[r]||0)+v}}
  let cyc=Infinity;for(const k in need)cyc=Math.min(cyc,Math.floor(countIn(c.slots,k)/need[k]));
  return{n,need,mins:cyc===Infinity?0:cyc*.5};
}
function doorLocked(d){
  let any=false,ok=false;
  for(const c of cups){if(Math.hypot(c.tx*T+8-d.x*T,c.ty*T+8-d.y*T)<=UP_R){any=true;if(c.auth)ok=true}}
  return any&&!ok;
}
const FREC=[['metal_ore','metal',20],['sulfur_ore','sulfur',20],['raw_meat','cooked_meat',1.2]];
function updFurnace(f,dt){
  let any=false;
  for(const [inn,out,rate] of FREC){
    if(f.inp[inn]>0&&f.fuel>=.2){
      any=true;f.acc[inn]+=rate*dt;
      const n=Math.min(Math.floor(f.acc[inn]),f.inp[inn],Math.floor(f.fuel/.2));
      if(n>0){f.acc[inn]-=n;f.inp[inn]-=n;f.out[out]+=n;f.fuel-=n*.2}
    }else f.acc[inn]=0;
  }
  f.on=any;
}

/* ================= INTERACCIÓN ================= */
function findInteract(){
  let best=null,bd=1e9;
  const ptx=Math.floor(P.x/T),pty=Math.floor(P.y/T);
  const cand=(d,label,fn)=>{if(d<bd){bd=d;best={label,fn}}};
  for(let ty=pty-2;ty<=pty+3;ty++)for(let tx=ptx-2;tx<=ptx+3;tx++){
    if(tx<0||ty<0||tx>=MW||ty>=MH)continue;
    const i=ty*MW+tx,f=furn.get(i);
    if(f){const d=Math.hypot(tx*T+8-P.x,ty*T+8-P.y);if(d<24)cand(d,f.type==='chest'?'Cofre':f.type==='furnace'?'Horno':'Armario',()=>openPanel(f.type==='chest'?'chest':f.type==='furnace'?'furnace':'cupboard',f))}
    const r=res[i];
    if(r&&!r.dead&&r.t==='cloth'){const d=Math.hypot(tx*T+8-P.x,ty*T+8-P.y);if(d<20)cand(d,'Recoger',()=>{r.dead=true;r.respawn=time+150;resDead.push(r);give('cloth',ri(3,6));sfx('pickup')})}
    for(const t of [0,1]){
      const p=edges.get(ek(tx,ty,t));
      if(p&&p.k==='door'){const c=pieceCenter(p),d=Math.hypot(c[0]-P.x,c[1]-P.y);if(d<20)cand(d-3,p.open?'Cerrar':'Abrir',()=>{
        if(!p.open&&doorLocked(p)){toast('🔒 Bloqueada: autorízate en el armario');sfx('err');return}
        if(p.open){const r=edgeRect(p.x,p.y,p.t);if(overlapsPlayer(r[0],r[1],r[2],r[3])){toast('Estás en medio');return}}
        p.open=!p.open;sfx('door')})}
    }
  }
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const x=ptx+i,y=pty+j;if(x>=0&&y>=0&&x<MW&&y<MH&&tile[y*MW+x]===0){cand(18,'Beber',()=>{if(P.water>=99){toast('No tienes sed');return}P.water=Math.min(100,P.water+25);sfx('drink')});}}
  return best;
}

function mkStick(base){
  const knob=base.firstElementChild,st={x:0,y:0,on:false,id:-1};
  function setv(e){const r=base.getBoundingClientRect(),R=r.width/2,cx=r.left+R,cy=r.top+R;let dx=(e.clientX-cx)/(R*.7),dy=(e.clientY-cy)/(R*.7);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}st.x=dx;st.y=dy;knob.style.transform=`translate(${dx*R*.7}px,${dy*R*.7}px)`}
  base.addEventListener('pointerdown',e=>{e.preventDefault();st.on=true;st.id=e.pointerId;try{base.setPointerCapture(e.pointerId)}catch(x){}setv(e)});
  base.addEventListener('pointermove',e=>{if(st.on&&e.pointerId===st.id)setv(e)});
  const end=e=>{if(e.pointerId===st.id){st.on=false;st.x=st.y=0;knob.style.transform='translate(0,0)'}};
  base.addEventListener('pointerup',end);base.addEventListener('pointercancel',end);
  st.reset=()=>{st.on=false;st.x=st.y=0;knob.style.transform='translate(0,0)'};
  return st;
}

  const x=el('button','b no','✕');x.style.padding='3px 6px';x.onclick=()=>{m.style.display='none'};tabs.append(x);m.append(tabs);
  const chips=el('div','chips');
  const chip=(name,cost,sw,fn)=>{const ok=!cost||canPay(cost);const c=el('div','chip'+(ok?'':' bad'));
    c.innerHTML=(sw?`<img src="${sw}" class="ic" style="width:36px;height:12px;margin-bottom:2px">`:'')+`<b>${name}</b>${cost?costStr(cost):'Toca un objeto'}`;c.onclick=fn;chips.append(c)};
  if(bTab===0)for(let t=0;t<4;t++)chip(TIER[t].n,TIER[t].cost,WSW[t],()=>startBuild('wall',t));
  else if(bTab===1)for(const t of [1,3])chip('Puerta '+DOORS[t].n.toLowerCase(),DOORS[t].cost,DSW[t],()=>startBuild('door',t));
  else if(bTab===2)for(const k of ['furnace','chest','cupboard'])chip(FCOST[k].n,FCOST[k].cost,null,()=>startBuild(k,0));
  else chip('Demoler pieza',null,null,()=>startBuild('demo',0));
  m.append(chips);
  m.append(el('div','','<div style="font-size:9px;opacity:.65;margin-top:4px">Toca el mapa para elegir dónde. Hasta 4 paredes por cuadro. Mejora una pared construyendo un material superior encima.</div>'));
}
$('bInv').onclick=()=>togglePanel('inv');
$('bCraft').onclick=()=>togglePanel('craft');
$('bMap').onclick=()=>togglePanel('map');
$('mini').onclick=()=>togglePanel('map');
$('bMenu').onclick=()=>togglePanel('menu');
$('bBuild').onclick=toggleBuildMenu;
$('bOk').onclick=confirmBuild;
$('bNo').onclick=()=>{stopBuild();renderBMenu();$('bmenu').style.display='block'};
$('bRot').onclick=()=>{B.rot=(B.rot+1)%4;if(B.manual)B.manual.e=(B.manual.e+1)%4;sfx('click')};
$('bRespawn').onclick=respawn;
function rebuildHotbar(){
  const hb=$('hotbar');hb.innerHTML='';
  for(let i=0;i<HOT;i++){
    const s=el('div','hs'+(i===P.sel?' sel':''));s.append(el('span','num',i+1));
    const it=inv[i];if(it){s.append(iconImg(it.id,24));if(IT[it.id].max>1)s.append(el('b','cnt',fmt(it.n)))}
    s.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();P.sel=i;uiDirty=true;sfx('click')});
    hb.append(s);
  }
  const it=inv[P.sel],isGun=it&&IT[it.id].gun;
  document.body.classList.toggle('gun',!!isGun);
  $('hinfo').textContent=it?IT[it.id].n+(isGun?' · Clavos: '+countIn(inv,'nails'):''):'';
  bAct.textContent=it&&IT[it.id].use?'✚':isGun?'🔫':'⚒';
}
/* ================= UPDATE ================= */
let saveT=0,upT=0,rspT=0,hudT=0;
function update(dt){
  time+=dt;
  if(P.dead)return;
  let mx=0,my=0;
  if(stL.on){mx=stL.x;my=stL.y;const l=Math.hypot(mx,my);if(l<.15)mx=my=0}
  if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;if(keys.w||keys.arrowup)my-=1;if(keys.s||keys.arrowdown)my+=1;
  let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;l=1}
  if(l>.1)B.manual=null;
  const it=held(),isGun=it&&IT[it.id].gun;
  if(l>0){
    moveEnt(P,mx*P.speed*dt,0);moveEnt(P,0,my*P.speed*dt);
    P.moving=true;P.anim+=dt*(.5+l);
    if(!(isGun&&stR.on)){P.face=Math.abs(mx)>Math.abs(my)?(mx>0?1:3):(my>0?2:0)}
    if(!(isGun&&stR.on)){P.aim=[mx/l,my/l]}
  }else P.moving=false;
  // apuntado
  if(isGun&&stR.on&&Math.hypot(stR.x,stR.y)>.25){
    const m=Math.hypot(stR.x,stR.y);P.aim=[stR.x/m,stR.y/m];
    P.face=Math.abs(P.aim[0])>Math.abs(P.aim[1])?(P.aim[0]>0?1:3):(P.aim[1]>0?2:0);
    if(m>.55)fireGun();
  }else if(mouse.on&&!stL.on&&!modal){
    const [wx,wy]=toWorld(mouse.x,mouse.y),dx=wx-P.x,dy=wy-P.y,m=Math.hypot(dx,dy);
    if(m>4&&(mouse.down||isGun)){P.aim=[dx/m,dy/m];P.face=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)}
  }
  if(actHeld||mouse.down||keys[' '])doAction(false);
  P.cool=Math.max(0,P.cool-dt);P.gcool=Math.max(0,P.gcool-dt);P.swing=Math.max(0,P.swing-dt);P.hurt=Math.max(0,P.hurt-dt);
  // supervivencia (lenta)
  P.food=Math.max(0,P.food-dt*.03);P.water=Math.max(0,P.water-dt*.045);
  let hp=0;
  if(P.food<=0)hp-=.5;if(P.water<=0)hp-=.7;if(P.inf)hp-=.45;
  if(!hp&&P.food>40&&P.water>40&&P.hp<100)hp=.25;
  if(hp){P.hp=Math.min(100,P.hp+hp*dt);if(P.hp<=0)die()}
  // recursos
  for(let i=0;i<resDead.length;i++){const r=resDead[i];if(time>=r.respawn){
    const px=r.x*T+8,py=r.y*T+8;if(Math.hypot(px-P.x,py-P.y)>24&&!furn.has(r.y*MW+r.x)){r.dead=false;r.hp=r.mx;resDead.splice(i,1);i--}else r.respawn=time+20}}
  // objetos / entidades
  updAnimals(dt);updBullets(dt);
  for(const f of furnaces)updFurnace(f,dt);
  for(const d of drops){d.t+=dt;if(d.t>d.nopick&&Math.hypot(d.x-P.x,d.y-P.y)<14){const left=addTo(inv,d.id,d.n,true);const got=d.n-left;if(got>0){floater('+'+got+' '+IT[d.id].n,'#ffe9a8');sfx('pickup');uiDirty=true}d.n=left;if(left<=0)d.dead=true}}
  if(drops.some(d=>d.dead||d.t>600))drops=drops.filter(d=>!d.dead&&d.t<=600);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt}
  if(parts.some(p=>p.life<=0))parts=parts.filter(p=>p.life>0);
  for(const f of floaters){f.life-=dt;f.y-=10*dt}
  if(floaters.some(f=>f.life<=0))floaters=floaters.filter(f=>f.life>0);
  // shake de recursos visibles
  const ptx=Math.floor(P.x/T),pty=Math.floor(P.y/T);
  for(let ty=pty-3;ty<=pty+3;ty++)for(let tx=ptx-3;tx<=ptx+3;tx++){if(tx<0||ty<0||tx>=MW||ty>=MH)continue;const r=res[ty*MW+tx];if(r&&r.shake>0)r.shake=Math.max(0,r.shake-dt)}
  updGhost();
  curInt=findInteract();
  // timers
  upT+=dt;if(upT>=30){upT=0;upkeepTick()}
  rspT+=dt;if(rspT>5){rspT=0;if(animals.length<140)spawnAnimal(false)}
  saveT+=dt;if(saveT>20){saveT=0;saveGame()}
}
/* ================= RENDER ================= */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.max(1,Math.floor(innerWidth*dpr));cv.height=Math.max(1,Math.floor(innerHeight*dpr));
  S=Math.max(2,Math.round(cv.height/210));
}
window.addEventListener('resize',resize);
function drawEdge(p,x,y,t,alpha){
  const r=edgeRect(x,y,t);
  if(alpha!=null)ctx.globalAlpha=alpha;
  if(p.k==='door'&&p.open){
    if(t===0)paintWall(ctx,x*T-2,y*T-13,4,13,p.tier,false,true);else paintWall(ctx,x*T-13,y*T-2,13,4,p.tier,true,true);
  }else paintWall(ctx,r[0],r[1],r[2],r[3],p.tier,t===0,p.k==='door');
  if(p.hp<p.mx*.5){ctx.fillStyle='rgba(0,0,0,.45)';const h=(x*13+y*7)%5;ctx.fillRect(r[0]+3+h,r[1]+1,1,2);ctx.fillRect(r[0]+8+h,r[1]+2,1,2)}
  if(alpha!=null)ctx.globalAlpha=1;
}
function drawPlayer(){
  const f=P.face,fr=P.moving?1+((P.anim*8|0)&1):0;
  const dirIdx=f===3?1:f,spr=PSPR[dirIdx===1?1:dirIdx===0?0:2][fr];
  const x=Math.round(P.x-8),y=Math.round(P.y-12);
  const it=held();
  const drawHeld=()=>{
    if(!it)return;const def=IT[it.id];const ic=ICONS[it.id];
    ctx.save();
    if(def.gun){
      const ax=P.aim[0],ay=P.aim[1],ang=Math.atan2(ay,ax);
      ctx.translate(Math.round(P.x+ax*6),Math.round(P.y-2+ay*6));ctx.rotate(ang);if(ax<0)ctx.scale(1,-1);ctx.drawImage(ic,-6,-6);
    }else if(def.tool){
      const [fx,fy]=DIRS[f],ang=Math.atan2(fy,fx)+Math.PI/2+(P.swing>0?((P.swing/.25)*1.8-.9):0);
      ctx.translate(Math.round(P.x+fx*7),Math.round(P.y-2+fy*6));ctx.rotate(ang);ctx.drawImage(ic,-6,-9);
    }else{ctx.translate(Math.round(P.x+(f===3?-6:6)),Math.round(P.y-1));ctx.drawImage(ic,-6,-6)}
    ctx.restore();
  };
  const behind=f===0;
  if(behind)drawHeld();
  if(f===3){ctx.save();ctx.translate(x+16,y);ctx.scale(-1,1);ctx.drawImage(spr,0,0);ctx.restore()}else ctx.drawImage(spr,x,y);
  if(P.hurt>0){ctx.globalAlpha=.4;ctx.fillStyle='#f00';ctx.fillRect(x+4,y+1,8,13);ctx.globalAlpha=1}
  if(!behind)drawHeld();
}
function render(){
  const W=cv.width,Hh=cv.height;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b1a2a';ctx.fillRect(0,0,W,Hh);
  const vw=W/S,vh=Hh/S;
  let cx=Math.round(P.x-vw/2),cy=Math.round(P.y-vh/2);
  cx=clamp(cx,-8,Math.max(-8,MW*T-vw+8));cy=clamp(cy,-8,Math.max(-8,MH*T-vh+8));
  camX=cx;camY=cy;
  ctx.setTransform(S,0,0,S,-cx*S,-cy*S);ctx.imageSmoothingEnabled=false;
  const x0=Math.max(0,Math.floor(cx/T)),x1=Math.min(MW-1,Math.floor((cx+vw)/T)),y0=Math.max(0,Math.floor(cy/T)),y1=Math.min(MH-1,Math.floor((cy+vh)/T));
  const fr=(time*1.6)|0;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*MW+x,t=tile[i],set=TSET[t];
    let v=((x*73856093)^(y*19349663))>>>0;v%=set.length;if(t===0)v=((x*3+y*5)+fr)&3;
    ctx.drawImage(set[v],x*T,y*T);const dc=deco[i];if(dc)ctx.drawImage(DECO[dc],x*T,y*T);
  }
  if(edges.size){for(let y=y0;y<=y1+1;y++)for(let x=x0;x<=x1+1;x++){let p=edges.get(ek(x,y,0));if(p)drawEdge(p,x,y,0);p=edges.get(ek(x,y,1));if(p)drawEdge(p,x,y,1)}}
  for(const d of drops){if(d.x<cx-16||d.x>cx+vw+16||d.y<cy-16||d.y>cy+vh+16)continue;const bob=Math.sin(time*4+d.x)*1;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(Math.round(d.x-4),Math.round(d.y+4),8,2);ctx.drawImage(ICONS[d.id],Math.round(d.x-6),Math.round(d.y-6+bob))}
  const objs=[];
  for(let y=y0;y<=Math.min(MH-1,y1+1);y++)for(let x=x0;x<=x1;x++){
    const i=y*MW+x,r=res[i];
    if(r&&!r.dead){const sx=r.shake>0?Math.round(Math.sin(r.shake*70)*1):0;objs.push({y:y*T+T,f:()=>{if(r.t==='tree')ctx.drawImage(SPR.tree,x*T+sx,y*T-8);else ctx.drawImage(SPR[r.t],x*T+sx,y*T)}})}
    const f=furn.get(i);
    if(f)objs.push({y:y*T+T,f:()=>{let s=SPR[f.type];if(f.type==='furnace')s=SPR.furnace[f.on?1+((time*6|0)&1):0];ctx.drawImage(s,x*T,y*T)}});
  }
  for(const a of animals){if(a.x<cx-16||a.x>cx+vw+16||a.y<cy-16||a.y>cy+vh+16)continue;
    objs.push({y:a.y+6,f:()=>{const s=ASPR[a.k][a.moving?(a.anim*6|0)&1:0],x=Math.round(a.x-8),y=Math.round(a.y-9);
      if(a.face===3){ctx.save();ctx.translate(x+16,y);ctx.scale(-1,1);ctx.drawImage(s,0,0);ctx.restore()}else ctx.drawImage(s,x,y);
      if(a.hurt>0){const w=Math.round(10*a.hp/AN[a.k].hp);ctx.fillStyle='#000';ctx.fillRect(x+2,y-3,12,3);ctx.fillStyle='#d9382c';ctx.fillRect(x+3,y-2,w,1)}}})}
  if(!P.dead)objs.push({y:P.y+6,f:drawPlayer});
  objs.sort((a,b)=>a.y-b.y);for(const o of objs)o.f();
  // láser
  const it=held();
  if(it&&IT[it.id].gun&&!P.dead){
    const ox=P.x+P.aim[0]*7,oy=P.y-1+P.aim[1]*7,e=rayEnd(ox,oy,P.aim[0],P.aim[1],150);
    ctx.strokeStyle='rgba(255,40,40,.75)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(e[0],e[1]);ctx.stroke();
    ctx.fillStyle=e[2]?'#ff8080':'#ff3030';ctx.fillRect(Math.round(e[0]-1),Math.round(e[1]-1),2,2);
  }
  for(const b of bullets){ctx.fillStyle='#e8ecf2';ctx.fillRect(Math.round(b.x-1),Math.round(b.y-1),2,2);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(Math.round(b.x-b.dx*3-.5),Math.round(b.y-b.dy*3-.5),1,1)}
  for(const p of parts){ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz)}
  ctx.globalAlpha=1;
  // fantasma de construcción
  if(B.on){
    const col=B.valid?'#40ff60':'#ff4040';
    if(B.type==='wall'||B.type==='door'){
      const ed=edgeFromTile(B.tx,B.ty,B.e),r=edgeRect(ed.x,ed.y,ed.t);
      ctx.globalAlpha=.5;paintWall(ctx,r[0],r[1],r[2],r[3],B.tier,ed.t===0,B.type==='door');ctx.globalAlpha=1;
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(r[0]+.5,r[1]+.5,r[2]-1,r[3]-1);
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(B.tx*T,B.ty*T,T,T);
    }else if(B.type==='demo'){
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(B.tx*T+.5,B.ty*T+.5,T-1,T-1);
      if(B.target&&B.target.kind==='edge'){const p=B.target.p,r=edgeRect(p.x,p.y,p.t);ctx.fillStyle='rgba(255,0,0,.5)';ctx.fillRect(r[0],r[1],r[2],r[3])}
    }else{
      let s=SPR[B.type];if(B.type==='furnace')s=SPR.furnace[0];
      ctx.globalAlpha=.55;ctx.drawImage(s,B.tx*T,B.ty*T);ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(B.tx*T+.5,B.ty*T+.5,T-1,T-1);
    }
  }
  ctx.font='bold 7px "Courier New",monospace';ctx.textAlign='center';
  for(const f of floaters){ctx.globalAlpha=clamp(f.life*2,0,1);ctx.fillStyle='#000';ctx.fillText(f.txt,Math.round(f.x)+1,Math.round(f.y)+1);ctx.fillStyle=f.col;ctx.fillText(f.txt,Math.round(f.x),Math.round(f.y))}
  ctx.globalAlpha=1;
  ctx.setTransform(1,0,0,1,0,0);
  if(P.hurt>0){ctx.fillStyle=`rgba(255,0,0,${P.hurt*.5})`;ctx.fillRect(0,0,W,Hh)}
  if(P.hp<30&&!P.dead){ctx.fillStyle=`rgba(120,0,0,${.15+.1*Math.sin(time*5)})`;ctx.fillRect(0,0,W,Hh)}
}
/* HUD */
const mctx=$('mini').getContext('2d');
function hudTick(dt){
  hudT+=dt;
  if(uiDirty){uiDirty=false;rebuildHotbar();if(modal==='inv'||modal==='craft'||modal==='chest'||modal==='cupboard')renderPanel()}
  if(hudT<.15)return;hudT=0;
  $('bHp').style.width=clamp(P.hp,0,100)+'%';$('bFood').style.width=clamp(P.food,0,100)+'%';$('bWater').style.width=clamp(P.water,0,100)+'%';
  $('inf').style.display=P.inf?'block':'none';
  const u=$('bUse');
  if(curInt&&!modal&&!P.dead){u.style.display='flex';if(u.textContent!==curInt.label)u.textContent=curInt.label}else u.style.display='none';
  // minimapa
  const sx=clamp(Math.round(P.x/T)-32,0,MW-64),sy=clamp(Math.round(P.y/T)-32,0,MH-64);
  mctx.imageSmoothingEnabled=false;mctx.drawImage(mini,sx,sy,64,64,0,0,64,64);
  for(const f of furn.values()){if(f.tx>=sx&&f.tx<sx+64&&f.ty>=sy&&f.ty<sy+64){mctx.fillStyle=f.type==='cupboard'?'#ffd04a':f.type==='furnace'?'#ff7a1a':'#b07a42';mctx.fillRect(f.tx-sx-1,f.ty-sy-1,3,3)}}
  mctx.fillStyle='#ff2020';mctx.fillRect(P.x/T-sx-1.5,P.y/T-sy-1.5,3,3);
  if(modal==='furnace')refreshFurnace();
}
/* LOOP */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!running)return;
  if(!isPaused())update(dt);
  render();hudTick(dt);
}
/* ARRANQUE */
resize();
$('bPlay').onclick=()=>{auInit();$('start').style.display='none';try{localStorage.removeItem(SKEY)}catch(e){}newGame(null);toast('Golpea árboles con tu roca para conseguir madera')};
const sv=loadSave();
if(sv){$('bCont').style.display='';$('bCont').onclick=()=>{auInit();$('start').style.display='none';newGame(sv);toast('Partida cargada')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!P.dead)saveGame()});
window.addEventListener('beforeunload',()=>{if(running&&!P.dead)saveGame()});
requestAnimationFrame(frame);
})();
