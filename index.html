<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Defense Web - Beta</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <!-- Capa de Interfaz de Usuario -->
    <div id="ui-layer">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="resource">
                <span class="icon">🪙</span>
                <span id="coins-display">3922</span>
            </div>
            <div class="resource">
                <span class="icon">💎</span>
                <span id="gems-display">2414</span>
            </div>
        </div>

        <!-- Menú Inferior -->
        <div class="bottom-menu">
            <!-- Pestañas -->
            <div class="tabs">
                <div class="tab active">Héroe</div>
                <div class="tab">Nivel</div>
                <div class="tab">Subir Estrella</div>
                <div class="tab">Tecnología</div>
            </div>
            
            <!-- Cartas de Héroes -->
            <div class="hero-roster">
                <!-- Ametrallador -->
                <div class="hero-card" id="card-ametrallador" onclick="interactHero('ametrallador')">
                    <div class="hero-name">Ametrallador</div>
                    <div class="hero-image-placeholder" style="background: #e74c3c;"></div>
                    <div class="hero-status">Nv.50</div>
                    <button class="action-btn select-btn">Seleccionar</button>
                </div>

                <!-- Artillería -->
                <div class="hero-card" id="card-artilleria" onclick="interactHero('artilleria')">
                    <div class="hero-name">Artillería</div>
                    <div class="hero-image-placeholder" style="background: #27ae60;"></div>
                    <div class="hero-status">Nv.5</div>
                    <button class="action-btn buy-btn">🪙 136.9K</button>
                </div>

                <!-- Soldado Electro -->
                <div class="hero-card" id="card-electro" onclick="interactHero('electro')">
                    <div class="hero-name">Soldado Electro</div>
                    <div class="hero-image-placeholder" style="background: #3498db;"></div>
                    <div class="hero-status">Nv.50</div>
                    <button class="action-btn select-btn">Seleccionar</button>
                </div>

                <!-- Bombero -->
                <div class="hero-card locked" id="card-bombero" onclick="interactHero('bombero')">
                    <div class="hero-name">Bombero</div>
                    <div class="hero-image-placeholder" style="background: #34495e;">🔒</div>
                    <div class="hero-status">Bloqueado</div>
                    <button class="action-btn gem-btn">💎 200</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor del Motor Gráfico -->
    <div id="game-container"></div>
    <script src="game.js"></script>
</body>
</html>
