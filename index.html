<style>
:root{--bg:#12161f;--pn:#1c2230;--pn2:#252d40;--tx:#e8ecf5;--mu:#8e99b0;--ac:#4f8cff;--ok:#3ecf72;--er:#f0584a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
h1,h2{font-family:'Lilita One',Arial,sans-serif;font-weight:400;margin:0 0 10px}h1{font-size:26px}h2{font-size:20px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}.pn{background:var(--pn);border-radius:12px;padding:14px;margin-bottom:14px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.grow{flex:1 1 160px!important}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--pn2);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;border:2px solid transparent}.card.sel{border-color:var(--ac)}

.chip{display:inline-flex;align-items:center;gap:4px;background:#0003;border-radius:20px;padding:2px 4px 2px 2px;margin:2px}.chip button{padding:0 7px;background:none;border:0;color:var(--er);font-size:18px;line-height:1}

.hide{display:none}h3{font-family:'Lilita One',Arial,sans-serif;font-weight:400;margin:14px 0 0;font-size:17px;color:var(--mu)}
.bdg{--s:64px;--c3:var(--c1);--tc:#fff;position:relative;display:inline-block;flex:none;width:var(--s);height:var(--s);vertical-align:middle;--gl:var(--c2);--clip:none;--br:50%}

.bdg .core{position:absolute;inset:calc(var(--s)*.09);border-radius:var(--br);clip-path:var(--clip);background:radial-gradient(circle at 35% 28%,var(--c2),var(--c1) 78%);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 calc(var(--s)*.03) calc(var(--s)*.06) #fff8,inset 0 calc(var(--s)*-.05) calc(var(--s)*.08) #0006}

.bdg .core img{position:relative;width:62%;height:62%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008)}
.bdg em{position:absolute;inset:0;border-radius:var(--br);clip-path:var(--clip);overflow:hidden;pointer-events:none;display:none}
.bdg em::after{content:'';position:absolute;top:-20%;bottom:-20%;width:34%;left:-60%;background:linear-gradient(100deg,#fff0,#fffc,#fff0);transform:skewX(-18deg);animation:bdgSh 2.6s ease-in-out infinite}
.bdg u{position:absolute;color:#fff;font-size:calc(var(--s)*.26);pointer-events:none;display:none;text-shadow:0 0 6px #fff,0 0 10px var(--c2)}
.bdg u.a{left:-6%;top:6%;animation:bdgTw 1.8s ease-in-out infinite}.bdg u.b{right:-4%;top:18%;animation:bdgTw 1.8s ease-in-out .6s infinite}
.bdg u.c{left:8%;bottom:-6%;animation:bdgTw 1.8s ease-in-out 1.1s infinite}.bdg u.d{right:4%;bottom:-8%;animation:bdgTw 1.8s ease-in-out .3s infinite}
.bdg .halo{position:absolute;pointer-events:none;display:none}
.bdg .orn{position:absolute;left:50%;top:calc(var(--s)*-.2);transform:translateX(-50%);font-size:calc(var(--s)*.36);line-height:1;filter:drop-shadow(0 2px 2px #000a);pointer-events:none;white-space:nowrap}
.bdg .rib{position:absolute;left:50%;bottom:calc(var(--s)*-.07);transform:translateX(-50%);min-width:56%;max-width:130%;padding:0 calc(var(--s)*.07);height:calc(var(--s)*.24);line-height:calc(var(--s)*.24);border-radius:calc(var(--s)*.05);font:400 calc(var(--s)*.17)/calc(var(--s)*.24) 'Lilita One',Arial,sans-serif;text-align:center;color:#fff;background:linear-gradient(var(--rc,#c0392b),color-mix(in srgb,var(--rc,#c0392b) 60%,#000));border:calc(var(--s)*.02) solid #fffd;text-shadow:0 1px 0 #0009;white-space:nowrap;box-shadow:0 2px 3px #0008;pointer-events:none}
/* formas */
.bdg.sh-hex{--clip:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);--br:0}

.bdg.sh-star{--clip:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);--br:0}
.bdg.sh-diamond{--clip:polygon(50% 0,100% 50%,50% 100%,0 50%);--br:0}
.bdg.sh-oct{--clip:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);--br:0}
.bdg.sh-square{--br:24%}
.bdg.sh-seal{--clip:polygon(50% 0,60% 14%,76% 6%,78% 24%,94% 24%,88% 40%,100% 50%,88% 60%,94% 76%,78% 76%,76% 94%,60% 86%,50% 100%,40% 86%,24% 94%,22% 76%,6% 76%,12% 60%,0 50%,12% 40%,6% 24%,22% 24%,24% 6%,40% 14%);--br:0}
.bdg.sh-star .core,.bdg.sh-seal .core,.bdg.sh-diamond .core{inset:calc(var(--s)*.12)}

.bdg.sh-hex .ring,.bdg.sh-shield .ring,.bdg.sh-star .ring,.bdg.sh-diamond .ring,.bdg.sh-oct .ring,.bdg.sh-seal .ring{animation:none!important}

.bdg.rs-solid .ring{background:var(--c1)}
.bdg.rs-grad .ring{background:conic-gradient(from 0deg,var(--c1),var(--c3),var(--c2),var(--c1))}
.bdg.rs-dash .ring{background:repeating-conic-gradient(var(--c1) 0 10deg,var(--c2) 10deg 20deg)}
.bdg.rs-rainbow .ring{background:conic-gradient(from 0deg,#ff3d6e,#ffb02e,#fff35c,#4dff88,#3df0ff,#5a7bff,#c64dff,#ff3d6e)}
.bdg.rs-metal .ring{background:conic-gradient(from 30deg,#fff,var(--c1),#555,var(--c2),#fff,var(--c1),#555,var(--c2),#fff)}

.bdg.pt-rays .core::before{background:repeating-conic-gradient(from 0deg,#fff3 0 8deg,#fff0 8deg 16deg)}
.bdg.pt-stripes .core::before{background:repeating-linear-gradient(45deg,#fff3 0 calc(var(--s)*.06),#fff0 calc(var(--s)*.06) calc(var(--s)*.12))}
.bdg.pt-lines .core::before{background:repeating-linear-gradient(0deg,#0002 0 calc(var(--s)*.04),#fff0 calc(var(--s)*.04) calc(var(--s)*.09))}
.bdg.pt-dots .core::before{background:radial-gradient(circle,#fff5 0 18%,#fff0 20%) 0 0/calc(var(--s)*.14) calc(var(--s)*.14)}
.bdg.pt-checker .core::before{background:conic-gradient(#fff3 0 25%,#fff0 0 50%,#fff3 0 75%,#fff0 0) 0 0/calc(var(--s)*.2) calc(var(--s)*.2)}
.bdg.pt-burst .core::before{background:radial-gradient(circle,#fffc 0,#fff0 62%)}
.bdg.pt-grid .core::before{background:linear-gradient(#fff3 1px,#fff0 1px) 0 0/calc(var(--s)*.14) calc(var(--s)*.14),linear-gradient(90deg,#fff3 1px,#fff0 1px) 0 0/calc(var(--s)*.14) calc(var(--s)*.14)}

.bdg.fx-shine em{display:block}

.bdg.fx-pulse .core{animation-name:bdgPu;animation-duration:1.8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.bdg.fx-hue .core{animation-name:bdgHue;animation-duration:5s;animation-iteration-count:infinite;animation-timing-function:linear}

.bdg.fx-rays::before{content:'';position:absolute;inset:-26%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#fff0 0 9deg,#ffffffaa 9deg 11deg,#fff0 11deg 20deg);-webkit-mask:radial-gradient(circle,#0000 0 45%,#000 52%,#0000 72%);mask:radial-gradient(circle,#0000 0 45%,#000 52%,#0000 72%);animation:bdgSpin 14s linear infinite;pointer-events:none}
/* ===== rarezas: cada una tiene estructura propia ===== */
/* común: placa plana, sin brillo */
.bdg.r-common .ring{background:linear-gradient(#e6e9f0,#8a93a6)}
.bdg.r-common .core{box-shadow:inset 0 2px 3px #fff8,inset 0 -3px 5px #0004}

/* épica: aro facetado + corona de gemas giratoria + brillo y pulso */
.bdg.r-epic .ring{background:repeating-conic-gradient(from 0deg,var(--c1) 0 15deg,#fff 15deg 17deg,var(--c2) 17deg 32deg,#fff 32deg 34deg)}

.bdg.r-mythic{--gl:var(--c1)}

.bdg.r-mythic .core b{background:linear-gradient(180deg,#fff,#ffe27a 55%,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:calc(var(--s)*.02) #5a1a7a;text-shadow:none}
.bdg.r-mythic .halo{display:block;inset:calc(var(--s)*-.1);border-radius:50%;background:radial-gradient(circle,#0000 58%,var(--c1) 68%,#0000 80%);opacity:.7;animation:bdgPu 1.6s ease-in-out infinite}
.bdg.r-mythic:not(.sh-circle) .halo{display:none}
.bdg.r-legendary:not(.sh-circle) .halo{display:none}
/* iconos con color propio anulan el degradado de texto del mítico */
.bdg.tc .core b{background:none!important;-webkit-text-fill-color:var(--tc)!important;color:var(--tc)!important}
@keyframes bdgSh{0%,55%{left:-60%}100%{left:130%}}

function msg(id,t,k){const e=$(id);e.textContent=t||'';e.className='msg '+(k||'')}
const errT=e=>/no autorizado/i.test(e.message||'')?'Esta cuenta no es administradora.':(e.message||String(e));
async function login(){msg('lm','Entrando…');const u=$('u').value.trim().toLowerCase(),p=$('p').value;
 const r=await sb.auth.signInWithPassword({email:u+'@clanclash.game',password:p});if(r.error)return msg('lm','Usuario o contraseña incorrectos','e');
 if(!await load())return;$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent='Sesión: '+u}
async function load(){const r=await sb.rpc('admin_badges');if(r.error){msg('lm',errT(r.error),'e');await sb.auth.signOut();return false}B=r.data||[];drawB();return true}
function drawB(){$('bl2').innerHTML=B.map(b=>`<div class="card${sel==b.id?' sel':''}" data-id="${esc(b.id)}">${badgeHTML(b,52)}<div><b>${esc(b.name)}</b><small>${RN[b.rarity]||b.rarity} · ${b.owners} jugador(es)</small></div></div>`).join('')||'<small>No hay insignias.</small>';
 $('gb').innerHTML=B.map(b=>`<option value="${esc(b.id)}">${esc(b.name)} (${RN[b.rarity]})</option>`).join('');prev()}
const FXN={shine:'Brillo barrido',sparkle:'Destellos',spin:'Anillo giratorio',glow:'Resplandor pulsante',float:'Flotar',pulse:'Latido',hue:'Cambio de tono',rays:'Rayos'};
$('efx').innerHTML=Object.keys(FXN).map(k=>`<label style="margin:0;display:flex;gap:4px;align-items:center;font-size:13px;color:var(--tx)"><input type=checkbox data-fx="${k}">${FXN[k]}</label>`).join('');
function getStyle(){const s={};if($('esh').value!='circle')s.shape=$('esh').value;if($('ept').value!='none')s.pat=$('ept').value;if($('erg').value)s.ring=$('erg').value;if($('eff').value)s.font=$('eff').value;
 if($('ec3o').checked)s.c3=$('ec3').value;if($('etco').checked)s.tc=$('etc').value;if(+$('efs').value!=100)s.fs=+$('efs').value/100;
 if($('eor').value.trim())s.orn=$('eor').value.trim();if($('eri').value.trim()){s.rib=$('eri').value.trim();s.rc=$('erc').value}
 if($('eim').value.trim())s.img=$('eim').value.trim();const fx=[...document.querySelectorAll('[data-fx]:checked')].map(x=>x.dataset.fx);if(fx.length)s.fx=fx;return s}
function setStyle(s){s=s||{};$('esh').value=s.shape||'circle';$('ept').value=s.pat||'none';$('erg').value=s.ring||'';$('eff').value=s.font||'';$('ec3o').checked=!!s.c3;$('ec3').value=s.c3||'#ffffff';$('etco').checked=!!s.tc;$('etc').value=s.tc||'#ffffff';
 $('efs').value=Math.round((s.fs||1)*100);$('efsv').textContent=$('efs').value;$('eor').value=s.orn||'';$('eri').value=s.rib||'';$('erc').value=s.rc||'#c0392b';$('eim').value=s.img||'';
 document.querySelectorAll('[data-fx]').forEach(x=>x.checked=(s.fx||[]).includes(x.dataset.fx))}
function curB(){return{rarity:$('era').value,icon:$('eic').value,c1:$('ec1').value,c2:$('ec2').value,style:getStyle()}}
function prev(){$('efsv').textContent=$('efs').value;const b=curB();$('pv').innerHTML=badgeHTML(b,120)+badgeHTML(b,64)+badgeHTML(b,36)}
function fill(b){sel=b?b.id:null;$('et').textContent=b?'Editar insignia':'Nueva insignia';$('eid').value=b?b.id:'';$('eid').disabled=!!b;$('enm').value=b?b.name:'';$('era').value=b?b.rarity:'common';$('eic').value=b?b.icon:'⭐';$('ec1').value=b?b.c1:'#6aa8ff';$('ec2').value=b?b.c2:'#2b57c4';$('eds').value=b?b.descr||'':'';setStyle(b&&b.style);$('bd').classList.toggle('hide',!b);msg('em');drawB()}
$('bl2').onclick=e=>{const c=e.target.closest('.card');if(c)fill(B.find(b=>b.id==c.dataset.id))};
['era','eic','ec1','ec2','esh','ept','erg','eff','ec3o','ec3','etco','etc','efs','eor','eri','erc','eim'].forEach(i=>{$(i).oninput=prev;$(i).onchange=prev});$('efx').onchange=prev;
async function save(){const id=$('eid').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(!id)return msg('em','Escribe un ID (letras, números o _)','e');const n=$('enm').value.trim();if(!n)return msg('em','Escribe un nombre','e');
 const st=getStyle();if(st.img&&!/^https:\/\/[^\s"'<>]+$/.test(st.img))return msg('em','La imagen debe ser una URL https válida','e');
 const r=await sb.rpc('admin_badge_save',{p_id:id,p_name:n,p_rarity:$('era').value,p_icon:$('eic').value||'⭐',p_c1:$('ec1').value,p_c2:$('ec2').value,p_descr:$('eds').value,p_style:st});
 if(r.error)return msg('em',errT(r.error),'e');await load();fill(B.find(b=>b.id==id));msg('em','Guardada ✔','o')}
async function del(){const b=B.find(x=>x.id==sel);if(!b||!confirm(`¿Eliminar "${b.name}"? Se quitará a sus ${b.owners} dueño(s).`))return;
 const r=await sb.rpc('admin_badge_delete',{p_id:b.id});if(r.error)return msg('em',errT(r.error),'e');await load();fill(null);msg('em','Eliminada','o')}
async function find(){msg('pm','Buscando…');const r=await sb.rpc('admin_find_players',{p_q:$('q').value.trim()});if(r.error)return msg('pm',errT(r.error),'e');PL=r.data||[];msg('pm',PL.length+' jugador(es)');drawP()}
function drawP(){$('pl').innerHTML=PL.map(p=>`<div class=pl><div><b>${esc(p.name)}</b> <small style="color:var(--mu)">#${esc(p.pid)} · nivel ${p.lvl} · ${p.trophies} 🏆</small><div>${(p.badges||[]).map(id=>{const b=B.find(x=>x.id==id);return b?`<span class=chip>${badgeHTML(b,28)}<small>${esc(b.name)}</small><button data-rv="${esc(id)}" data-p="${p.id}" title="Quitar">×</button></span>`:''}).join('')||'<small style="color:var(--mu)">Sin insignias</small>'}</div></div><button data-gr="${p.id}">+ Otorgar</button></div>`).join('')}
$('pl').onclick=async e=>{const g=e.target.closest('[data-gr]'),r=e.target.closest('[data-rv]');let x;
 if(g){const id=$('gb').value;if(!id)return;x=await sb.rpc('admin_badge_grant',{p_player:g.dataset.gr,p_badge:id})}
 else if(r){x=await sb.rpc('admin_badge_revoke',{p_player:r.dataset.p,p_badge:r.dataset.rv})}else return;
 if(x.error)return msg('pm',errT(x.error),'e');await find();await load();msg('pm','Hecho ✔','o')};
$('bl').onclick=login;$('p').onkeydown=e=>{if(e.key=='Enter')login()};$('bs').onclick=save;$('bn').onclick=()=>fill(null);$('bd').onclick=del;$('bq').onclick=find;$('q').onkeydown=e=>{if(e.key=='Enter')find()};
$('bo').onclick=async()=>{await sb.auth.signOut();location.reload()};
fill(null);
</script></body></html>
