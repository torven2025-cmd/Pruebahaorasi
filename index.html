<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle - Estable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="resource-bar">
                <div class="resource" title="Madera">🪵 <span id="res-wood">0</span></div>
                <div class="resource" title="Piedra">🪨 <span id="res-stone">0</span></div>
                <div class="resource" title="Monedas">🪙 <span id="res-coins">0/100</span></div>
                <div class="resource" title="Bárbaros">🗡️ <span id="res-troops">0</span></div>
                <div class="resource" title="Puntos">🏆 <span id="res-points">0</span></div>
            </div>

            <!-- UI NORMAL -->
            <div id="normal-ui">
                <div id="zoom-controls">
                    <button onclick="changeZoom(0.2)">🔍+</button>
                    <button onclick="changeZoom(-0.2)">🔍-</button>
                </div>
                <div id="action-menu">
                    <button class="action-btn build-mode-btn" onclick="enterBuildMode()">🔨 Construir</button>
                    <button class="action-btn" onclick="trainTroop()">Bárbaro<br><small>10🪵</small></button>
                    <button class="action-btn attack-btn" onclick="startCombatMatch()">⚔️ Atacar Base</button>
                    <!-- Nuevos Botones agregados sin cambiar el estilo original -->
                    <button class="action-btn" onclick="openShop()">🏪 Tienda</button>
                    <button class="action-btn" onclick="showNotification('📜 Misiones: ¡Próximamente!')">📜 Misiones</button>
                </div>
            </div>

            <!-- UI MODO CONSTRUCCIÓN -->
            <div id="build-ui" class="hidden">
                <button id="btn-exit-build" onclick="exitBuildMode()">Salir del Modo</button>
                
                <div id="build-tray">
                    <!-- Nuevas Estructuras -->
                    <button class="build-item" onclick="selectBuilding('goldmine')">
                        <span class="icon">⛏️🟡</span><br>Mina de Oro<br><small>50🪵 50🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('vault')">
                        <span class="icon">🏦</span><br>Almacén 🪙<br><small>100🪵 100🪨</small>
                    </button>
                    <!-- Estructuras Originales -->
                    <button class="build-item" onclick="selectBuilding('lumbermill')">
                        <span class="icon">🪚</span><br>Aserradero<br><small>20🪵 10🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('mine')">
                        <span class="icon">⛏️</span><br>Mina Piedra<br><small>10🪵 20🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('camp')">
                        <span class="icon">⛺</span><br>Campamento<br><small>50🪵 30🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('wall')">
                        <span class="icon">🧱</span><br>Muro<br><small>10🪵 5🪨</small>
                    </button>
                    <button class="build-item" onclick="selectBuilding('tower')">
                        <span class="icon">🗼</span><br>Torre<br><small>20🪵 15🪨</small>
                    </button>
                </div>

                <div id="placement-controls" class="hidden">
                    <button id="btn-cancel" onclick="cancelPlacement()">❌ Cancelar</button>
                    <button id="btn-confirm" onclick="confirmPlacement()">✅ Colocar</button>
                </div>
            </div>

            <!-- UI DE COMBATE -->
            <div id="combat-ui" class="hidden">
                <div id="combat-header">
                    <h2>🔥 ASALTO EN CURSO 🔥</h2>
                    <p>Toca los bordes para soltar bárbaros</p>
                    <button onclick="endCombat()">Rendirse</button>
                </div>
            </div>

            <!-- UI DE LA TIENDA -->
            <div id="shop-ui" class="hidden">
                <div class="shop-panel">
                    <h2>🏪 Tienda del Reino</h2>
                    <div class="shop-items">
                        <button onclick="buyExpansion()">
                            🗺️ Expandir Mapa (+5x5)<br>
                            <small>Costo: <span id="expansion-cost-text">100</span> 🪙</small>
                        </button>
                    </div>
                    <button class="close-btn" onclick="closeShop()">Cerrar Tienda</button>
                </div>
            </div>
            
            <div id="notification-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
