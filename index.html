<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castle Battle 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Capa de Interfaz -->
        <div id="ui-layer">
            
            <div id="resource-bar">
                <div class="resource" title="Madera">🪵 <span id="res-wood">50</span></div>
                <div class="resource" title="Piedra">🪨 <span id="res-stone">50</span></div>
                <div class="resource" title="Puntos">🏆 <span id="res-points">0</span></div>
            </div>

            <!-- Controles de Cámara (NUEVO) -->
            <div id="zoom-controls">
                <button onclick="changeZoom(0.2)">🔍+</button>
                <button onclick="changeZoom(-0.2)">🔍-</button>
            </div>

            <div id="action-menu">
                <button id="btn-gather" onclick="gatherResources()">⛏️ Talar/Picar</button>
                <button id="btn-combat" onclick="openCombat()">⚔️ Buscar Combate</button>
            </div>

            <div id="build-menu">
                <button class="build-btn" onclick="selectBuilding('wall')">
                    🧱 Muro<br><small>10🪵 5🪨</small>
                </button>
                <button class="build-btn" onclick="selectBuilding('tower')">
                    🗼 Torre<br><small>20🪵 15🪨</small>
                </button>
                <button class="build-btn" onclick="selectBuilding('archer')">
                    🏹 Arquero<br><small>10🪵 0🪨</small>
                </button>
            </div>

            <!-- Combate (Igual que antes) -->
            <div id="combat-overlay" class="hidden">
                <div class="combat-panel">
                    <h2>⚔️ Batalla ⚔️</h2>
                    <div class="health-bars">
                        <div class="hp-box">
                            <span>Tu Castillo</span>
                            <progress id="hp-player" value="100" max="100"></progress>
                            <span id="hp-player-text">100/100</span>
                        </div>
                        <div class="hp-box">
                            <span>Castillo Enemigo</span>
                            <progress id="hp-enemy" value="100" max="100"></progress>
                            <span id="hp-enemy-text">100/100</span>
                        </div>
                    </div>
                    <div id="combat-log">¡Prepárate!</div>
                    <div class="combat-actions">
                        <button id="btn-attack" onclick="performAttack()">🗡️ Atacar</button>
                        <button id="btn-flee" onclick="fleeCombat()">🏃 Retirada</button>
                    </div>
                </div>
            </div>
            
            <div id="notification-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
